spring:
  application:
    name: kunpeng-broker
    version: #@version@#

kunpeng:
  cluster:
    node-id: node01
    seed-nodes:
      - 127.0.0.1:2026
    network:
      advance-host: 127.0.0.1
  broker:
    raft:
      partitioning:
        partitions-count: 1
        replication-factor: 1
    manage:
      init-broker-id: node01
      replication-factor: 1
    threads:
      cpu-thread-count: 2
      io-thread-count: 2
    gateway:
      network:
        host: 127.0.0.1
        port: 2024
    sinks:
      dbms:
        className: com.anyilanxin.kunpeng.sink.rdbms.RdbmsSink
        args:
          url: jdbc:mysql://localhost:3306/kunpeng_process?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&useSSL=false&rewriteBatchedStatement=true&serverTimezone=Asia/Shanghai
          #          url: jdbc:postgresql://localhost:5432/kunpeng_process
          password: root
          userName: root
          tablePrefix: ANYI_
          caseSensitive: true
          autoDdl: true
