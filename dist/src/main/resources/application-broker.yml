spring:
  application:
    name: kunpeng-broker
    version: #@version@#

kunpeng:
  cluster:
    node-id: node01
    seed-nodes:
      - 127.0.0.1:24109
  broker:
    gateway:
      webapp:
        enabled: true
        # 控制台登录用户（password 支持 {noop}/{bcrypt} 前缀）
        users:
          - username: admin
            password: "{noop}admin123"
            roles:
              - ADMIN
    authorization:
      enabled: true
      admin-groups:
        - 1314235356968173568
    raft:
      partitioning:
        partitions-count: 1
        replication-factor: 1
    manage:
      init-broker-id: node01
      replication-factor: 1
    # actor 调度线程；cpu-thread-count 不配置时为 max(1, CPU 核数 - 2)
    threads:
      io-thread-count: 2
