import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'application'
    id 'org.springframework.boot'
    id "com.google.cloud.tools.jib"
}

dependencies {
    implementation project(':kunpeng:cluster:cluster')
    implementation project(':kunpeng:cluster:cluster-config')
    implementation project(':kunpeng:broker:broker')
    implementation project(':kunpeng:broker:broker-client')
    implementation project(':kunpeng:broker:broker-admin-client')
    implementation project(':kunpeng:protocol:protocol-common')
    implementation project(':kunpeng:protocol:protocol-admin')
    implementation project(':kunpeng:protocol:protocol-admin-impl')
    implementation project(':kunpeng:configuration')
    implementation project(':kunpeng:scheduler')
    implementation project(':kunpeng:utils')
    implementation project(':kunpeng:gateway:gateway')
    implementation project(':kunpeng:scheduler')
    implementation project(':kunpeng:structpack')

    implementation 'org.agrona:agrona'
    implementation 'io.netty:netty-transport-native-unix-common'
    implementation 'io.netty:netty-buffer'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta'
    implementation 'org.apache.logging.log4j:log4j-core'
    implementation 'org.apache.logging.log4j:log4j-api'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-health'
    implementation 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-micrometer-metrics'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"
}


processResources {
    filteringCharset = 'UTF-8'
    include('*.yml', "*.properties", "banners/*.txt", "*.xml")
    filesMatching('*.yml') {
        filter(
                ReplaceTokens,
                "tokens": [version: rootProject.version],
                "beginToken": "#@",
                "endToken": "@#"
        )
    }
}


configurations.configureEach {
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
}


tasks.register('createStart', CreateStartScripts) {
    mainClass = 'com.anyilanxin.Application'
    applicationName = "kunpeng"
    classpath = files('lib/*')
    outputDir = startScripts.outputDir
    defaultJvmOpts = ['-XX:+ExitOnOutOfMemoryError',
                      '-Dfile.encoding=UTF-8',
                      '-Xms1024m',
                      '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
                      '-Xshare:auto']
    optsEnvironmentVar('-Dbasedir=KP_APP_HOME -Dapp.pid="$$" -Dapp.name=kunpeng -Dapp.home=KP_APP_HOME')
    doLast {
        unixScript.text = unixScript.text
                .replace('$-Dbasedir', '-Dbasedir')
                .replace('KP_APP_HOME', '$APP_HOME')
                .replace('CLASSPATH=$APP_HOME/lib/*', 'CLASSPATH="$APP_HOME"/config:"$APP_HOME"/lib/*')
        windowsScript.text = windowsScript.text
                .replaceAll('%-Dbasedir', '-Dbasedir')
                .replace('KP_APP_HOME', '%APP_HOME%')
                .replace('set CLASSPATH=%APP_HOME%\\lib\\*', 'set CLASSPATH=%APP_HOME%\\config;%APP_HOME%\\lib\\*')
                .replace('-Dapp.pid="$$"', '')
                .replace('%APP_HOME%%', '%APP_HOME%')
    }
}


distributions {
    main {
        distributionBaseName = 'kunpeng'
        contents {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from("src/main/config") {
                into 'config'
                filter(ReplaceTokens,
                        "tokens": [version: version, name: project.name],
                        "beginToken": "#@",
                        "endToken": "@#")
            }
            from(createStart) {
                into 'bin'
                filePermissions {
                    user {
                        read = true
                        execute = true
                    }
                }
            }
        }
    }
}


jib {
    allowInsecureRegistries = true
    from {
        image = 'eclipse-temurin:25-jre'
    }
    to {
        image = 'kunpeng'
        tags = ['latest', rootProject.version] as List<String>
    }
    extraDirectories {
        paths {
            path {
                from = 'src/main/config'
                into = '/kunpeng/config'
            }
        }
    }
    containerizingMode = 'packaged'
    container {
        ports = ['2020', '9600', '24500', '24501', '24502']
        jvmFlags = ['-Xms1025m', '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED']
        environment = ["TZ": 'Asia/Shanghai']
        volumes = ["/kunpeng/data", "/kunpeng/logs"]
        mainClass = 'com.anyilanxin.Application'
        appRoot = '/kunpeng'
        workingDirectory = '/kunpeng'
    }
}


jar {
    archiveClassifier = ''
    archiveBaseName = 'kunpeng-dist'
    into("META-INF") {
        from "$rootDir/licenses"
        from "$rootDir/LICENSE"
        from "$rootDir/NOTICE"
    }
}

springBoot {
    buildInfo {
        properties {
            artifact = 'kunpeng'
            version = project.version
            name = 'Engine for Microservices Orchestration'
        }
    }
}

bootJar {
    enabled = true
    archiveClassifier = ''
    archiveBaseName = 'kunpeng'
    manifest {
        attributes(
                "Manifest-Version": 1.0,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Created-By': System.getProperty('java.version') + ' (' + System.getProperty('java.vendor') + ')',
                'Built-With': "gradle-${project.getGradle().getGradleVersion()}, groovy-${GroovySystem.getVersion()}",
                'Build-Time': "${new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")}",
                'Built-By': System.getProperty('user.name'),
                'Built-On': "${InetAddress.localHost.hostName}/${InetAddress.localHost.hostAddress}",
                'Build-Jdk-Spec': JavaVersion.VERSION_21
        )
    }
    into("META-INF") {
        from "$rootDir/licenses"
        from "$rootDir/LICENSE"
        from "$rootDir/NOTICE"
    }
}
