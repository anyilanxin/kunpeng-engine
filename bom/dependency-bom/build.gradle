plugins {
    id 'java-platform'
    id 'maven-publish'
    id 'kunpeng.dependency-update'
}

description = "AnYi Kunpeng Dependencies Bom"


javaPlatform {
    allowDependencies()
}


dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
    api platform("io.grpc:grpc-bom:$grpcBomVersion")
    api platform("com.google.protobuf:protobuf-bom:$protobufBomVersion")
    api platform('com.google.cloud:libraries-bom:26.88.1')
    api platform('org.junit:junit-bom:6.1.3')
    api platform("io.micrometer:micrometer-bom:1.17.0")
    api platform("tools.jackson:jackson-bom:3.2.2")
    api platform("org.apache.logging.log4j:log4j-bom:2.26.1")
    api platform('io.netty:netty-bom:4.2.18.Final')
    constraints {

    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId project.group
            version project.version
            artifactId "kunpeng-dependency-bom"
            from components.javaPlatform
            pom {
                name = "kunpeng-dependency-bom"
                url = 'https://github.com/anyilanxin/kunpeng-engine.git'
                description = project.description
                developers {
                    developer {
                        id = 'zxh'
                        name = 'zxh'
                        email = 'zxuanhong@aliyun.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/anyilanxin/kunpeng-engine.gi'
                    developerConnection = 'scm:git:ssh://github.com/anyilanxin/kunpeng-engine.gi'
                    url = 'https://anyilanxin.com'
                }
            }
        }
    }
    repositories {
        maven {
            allowInsecureProtocol = true
            credentials {
                username = rootProject.ext.repo['username']
                password = rootProject.ext.repo['password']
            }
            url = version.endsWith('SNAPSHOT') ? rootProject.ext.repo['snapshotsRepoUrl'] : rootProject.ext.repo['releasesRepoUrl']
        }
    }
}

