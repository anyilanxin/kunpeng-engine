plugins {
    id 'java-platform'
    id 'maven-publish'
    id 'kunpeng.dependency-update'
}

description = "AnYi Kunpeng Dependencies Bom"


javaPlatform {
    allowDependencies()
}


dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
    api platform("io.grpc:grpc-bom:$grpcBomVersion")
    api platform("com.google.protobuf:protobuf-bom:$protobufBomVersion")
    api platform('com.google.cloud:libraries-bom:26.86.0')
    api platform('org.junit:junit-bom:6.1.3')
    api platform("io.micrometer:micrometer-bom:1.17.0")
    api platform("tools.jackson:jackson-bom:3.2.2")
    api platform("org.apache.logging.log4j:log4j-bom:2.26.1")
    api platform('io.netty:netty-bom:4.2.17.Final')
    constraints {

        // rpc
        def protostuff = "1.8.0"
        api "io.protostuff:protostuff-core:$protostuff"
        api "io.protostuff:protostuff-runtime:$protostuff"

        def swagger = "2.2.54"
        api "io.swagger.core.v3:swagger-annotations:$swagger"
        api "io.swagger.core.v3:swagger-annotations-jakarta:$swagger"
        api "io.swagger.parser.v3:swagger-parser:2.1.47"

        def guava = "33.7.1-jre"
        api "com.google.guava:guava:$guava"
        api "com.google.guava:guava-testlib:$guava"

        // 脚本引擎----start
        api "org.python:jython-standalone:2.7.4"
        api 'com.alibaba:qlexpress4:4.1.3'

        def graalvmjs = "25.2.4"
        api "org.graalvm.js:js-scriptengine:$graalvmjs"
        api "org.graalvm.js:js:$graalvmjs"
        // 脚本引擎----end

        api "org.agrona:agrona:2.5.0"
        api "org.rocksdb:rocksdbjni:10.10.1.1"
        api 'org.liquibase:liquibase-core:5.0.3'
        api 'commons-codec:commons-codec:1.22.1'
        api 'org.apache.commons:commons-lang3:3.20.0'
        api 'commons-io:commons-io:2.22.0'
        api "org.apache.commons:commons-math3:3.6.1"
        api "com.cronutils:cron-utils:9.2.1"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId project.group
            version project.version
            artifactId "kunpeng-dependency-bom"
            from components.javaPlatform
            pom {
                name = "kunpeng-dependency-bom"
                url = 'https://github.com/anyilanxin/kunpeng-engine.git'
                description = project.description
                developers {
                    developer {
                        id = 'zxh'
                        name = 'zxh'
                        email = 'zxuanhong@aliyun.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/anyilanxin/kunpeng-engine.gi'
                    developerConnection = 'scm:git:ssh://github.com/anyilanxin/kunpeng-engine.gi'
                    url = 'https://anyilanxin.com'
                }
            }
        }
    }
    repositories {
        maven {
            allowInsecureProtocol = true
            credentials {
                username = rootProject.ext.repo['username']
                password = rootProject.ext.repo['password']
            }
            url = version.endsWith('SNAPSHOT') ? rootProject.ext.repo['snapshotsRepoUrl'] : rootProject.ext.repo['releasesRepoUrl']
        }
    }
}

