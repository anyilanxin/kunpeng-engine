publishing {
    publications {
        maven(MavenPublication) {
            groupId project.group
            version project.version
            artifactId "kunpeng-dependency-bom"
            from components.javaPlatform
            pom {
                name = "kunpeng-dependency-bom"
                url = 'https://github.com/anyilanxin/kunpeng-engine.git'
                description = project.description
                developers {
                    developer {
                        id = 'zxh'
                        name = 'zxh'
                        email = 'zxuanhong@aliyun.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/anyilanxin/kunpeng-engine.gi'
                    developerConnection = 'scm:git:ssh://github.com/anyilanxin/kunpeng-engine.gi'
                    url = 'https://anyilanxin.com'
                }
            }
        }
    }
    repositories {
        maven {
            allowInsecureProtocol = true
            credentials {
                username = rootProject.ext.repo['username']
                password = rootProject.ext.repo['password']
            }
            url = version.endsWith('SNAPSHOT') ? rootProject.ext.repo['snapshotsRepoUrl'] : rootProject.ext.repo['releasesRepoUrl']
        }
    }
}

