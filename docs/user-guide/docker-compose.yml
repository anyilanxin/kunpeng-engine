      - KUNPENG_BROKER_SINKS_ANYISTANDLONEPROCESS_CLASSNAME=com.anyilanxin.kunpeng.sink.rdbms.RdbmsSink
      - KUNPENG_BROKER_SINKS_ANYISTANDLONEPROCESS_ARGS_URL=jdbc:mysql://localhost:3306/kunpeng_process?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&useSSL=false&rewriteBatchedStatement=true&serverTimezone=Asia/Shanghai
