plugins {
    id 'kunpeng.build-publish'
}

description = "Kunpeng Sink RDBMS"

configure(jarInfo) {
    archiveName = "kunpeng-sink-rdbms"
}

dependencies {
    implementation project(':kunpeng:sink:sink-api')

    implementation project(':kunpeng:bpm-model:model-parse')
    implementation project(':kunpeng:protocol:protocol-business')
    implementation project(':kunpeng:protocol:protocol-common')

    implementation 'com.alibaba:druid'
    implementation 'org.mybatis:mybatis'
    implementation 'org.liquibase:liquibase-core'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'io.micrometer:micrometer-core'

    implementation 'org.postgresql:postgresql'
    implementation 'com.mysql:mysql-connector-j'
    implementation 'com.h2database:h2'

    // 配置绑定测试走生产同款 MapSinkConfig（broker 运行期传入的 SinkConfiguration 实现）
    testImplementation project(':kunpeng:sink:sink')
}
