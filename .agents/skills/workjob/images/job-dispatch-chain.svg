<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 200" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1020" height="200" fill="#ffffff"/>
  <text x="510" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">job 派发总体链路</text>
  <text x="510" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">client 经 gRPC 接入 gateway · gateway 复用 cluster/messaging 通道连接 broker（raft group）</text>

  <rect x="60" y="96" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">client</text>

  <line x1="250" y1="128" x2="406" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="328" y="116" text-anchor="middle" font-size="12" fill="#475569">gRPC</text>

  <rect x="410" y="96" width="190" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="505" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">gateway</text>

  <line x1="600" y1="128" x2="756" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="678" y="116" text-anchor="middle" font-size="12" fill="#475569">cluster/messaging</text>

  <rect x="760" y="96" width="200" height="64" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="860" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">broker(raft group)</text>
</svg>
