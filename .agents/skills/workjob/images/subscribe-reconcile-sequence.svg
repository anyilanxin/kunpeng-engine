<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="700" fill="#ffffff"/>
  <text x="800" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">① 订阅注册与对账时序</text>
  <text x="800" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">变化即写属性 · SWIM 版本反熵扩散</text>

  <!-- 生命线 -->
  <line x1="220" y1="144" x2="220" y2="660" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="540" y1="144" x2="540" y2="660" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="860" y1="144" x2="860" y2="660" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1180" y1="144" x2="1180" y2="660" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 参与者 -->
  <rect x="145" y="96" width="150" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">client</text>
  <text x="220" y="136" text-anchor="middle" font-size="11" fill="#64748b">（OpenJobStream）</text>

  <rect x="465" y="96" width="150" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="540" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">GatewayJobHub</text>

  <rect x="760" y="96" width="200" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="860" y="117" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">GatewayJobStreamClient</text>
  <text x="860" y="136" text-anchor="middle" font-size="11" fill="#64748b">(actor)</text>

  <rect x="1092" y="96" width="175" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1180" y="117" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">JobStreamCoordinator</text>
  <text x="1180" y="136" text-anchor="middle" font-size="11" fill="#64748b">(actor)</text>

  <!-- C→H register -->
  <line x1="220" y1="190" x2="534" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="377" y="178" text-anchor="middle" font-size="12" fill="#475569">register(type, worker)</text>

  <!-- H 自消息：分配会话 -->
  <polyline points="540,222 610,222 610,250 546,250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="528" y="232" text-anchor="end" font-size="12" fill="#475569">分配稳定会话 ID，sessions[sessionId] 注册</text>
  <text x="528" y="250" text-anchor="end" font-size="12" fill="#475569">（空名兜底 stream-{id}）</text>

  <!-- H→S snapshotChanged -->
  <line x1="540" y1="296" x2="854" y2="296" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="697" y="284" text-anchor="middle" font-size="12" fill="#475569">snapshotChanged（generation++）</text>

  <!-- S 自消息：写成员属性 -->
  <polyline points="860,328 930,328 930,356 866,356" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="942" y="346" font-size="12" fill="#475569">快照写入本地成员属性（SBE + base64）</text>

  <!-- Note over S,K -->
  <rect x="820" y="388" width="430" height="98" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1035" y="414" text-anchor="middle" font-size="11.5" fill="#854d0e">SWIM checkMetadata（≤250ms）bump metadataVersion</text>
  <text x="1035" y="433" text-anchor="middle" font-size="11.5" fill="#854d0e">→ 版本戳随 gossip 扩散（万级 ≈1.7s）</text>
  <text x="1035" y="452" text-anchor="middle" font-size="11.5" fill="#854d0e">→ 各 broker 按版本从源网关直拉属性</text>
  <text x="1035" y="471" text-anchor="middle" font-size="11.5" fill="#854d0e">（去重+抖动+版本仲裁）</text>

  <!-- K 自消息：解析合并 -->
  <polyline points="1180,518 1250,518 1250,548 1186,548" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1254" y="528" font-size="11" fill="#475569">METADATA_CHANGED 解析 → 代次比对</text>
  <text x="1254" y="546" font-size="11" fill="#475569">→ 桶替换 → rebuildView</text>

  <!-- Note over H,K -->
  <rect x="520" y="580" width="680" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="860" y="606" text-anchor="middle" font-size="12" fill="#854d0e">断流删会话即时重写属性；SWIM 成员移除自动摘桶；</text>
  <text x="860" y="626" text-anchor="middle" font-size="12" fill="#854d0e">稳态零流量（版本不变不拉）</text>
</svg>
