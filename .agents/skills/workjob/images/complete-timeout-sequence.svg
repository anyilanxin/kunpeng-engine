<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="600" fill="#ffffff"/>
  <text x="640" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">④ 完成与超时回退时序</text>
  <text x="640" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">完成走标准命令通道；到期由状态机自愈</text>

  <!-- 生命线 -->
  <line x1="170" y1="144" x2="170" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="450" y1="144" x2="450" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="730" y1="144" x2="730" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1010" y1="144" x2="1010" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 参与者 -->
  <rect x="120" y="96" width="100" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">client</text>

  <rect x="395" y="96" width="110" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">gateway</text>

  <rect x="665" y="96" width="130" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="730" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">commandapi</text>

  <rect x="945" y="96" width="130" height="48" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1010" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">引擎状态机</text>

  <!-- W→G CompleteJob -->
  <line x1="170" y1="190" x2="444" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="307" y="178" text-anchor="middle" font-size="12" fill="#475569">CompleteJob(jobKey)</text>

  <!-- G→A JobCompleteRequest -->
  <line x1="450" y1="246" x2="724" y2="246" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="587" y="224" text-anchor="middle" font-size="12" fill="#475569">JobCompleteRequest</text>
  <text x="587" y="240" text-anchor="middle" font-size="12" fill="#475569">（标准命令通道，失败自动重试）</text>

  <!-- A→E COMPLETING -->
  <line x1="730" y1="302" x2="1004" y2="302" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="867" y="290" text-anchor="middle" font-size="12" fill="#475569">COMPLETING 命令</text>

  <!-- E 自消息：COMPLETED -->
  <polyline points="1010,328 960,328 960,356 1004,356" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="948" y="346" text-anchor="end" font-size="11.5" fill="#475569">COMPLETED 事件（销账，摘到期索引）</text>

  <!-- E-->>W 完成响应 -->
  <line x1="1010" y1="412" x2="176" y2="412" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="260" y="400" text-anchor="middle" font-size="12" fill="#475569">完成响应</text>

  <!-- Note over E -->
  <rect x="815" y="444" width="390" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1010" y="474" text-anchor="middle" font-size="11.5" fill="#854d0e">超时未完成：JobTimeoutChecker 断点扫 JOB_DEADLINE 索引</text>
  <text x="1010" y="496" text-anchor="middle" font-size="11.5" fill="#854d0e">TIME_OUT → TIMED_OUT → 回 READY 供重新消费</text>
</svg>
