<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="620" fill="#ffffff"/>
  <text x="750" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">job 推拉系统总体架构与角色</text>
  <text x="750" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">client 进程（STREAM 流 / PULL 长轮询）· gateway · broker —— job 专属 wire 触点经 cluster/messaging，拉取/完成走标准命令通道</text>

  <!-- client 进程面板 -->
  <rect x="36" y="150" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="176" font-size="13" font-weight="700" fill="#475569">client 进程</text>

  <rect x="56" y="196" width="190" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="151" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">JobWorker</text>
  <text x="151" y="244" text-anchor="middle" font-size="12" fill="#475569">(type=A, STREAM)</text>

  <rect x="56" y="296" width="190" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="151" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">JobWorker</text>
  <text x="151" y="344" text-anchor="middle" font-size="12" fill="#475569">(type=A, PULL)</text>

  <!-- gateway 面板 -->
  <rect x="366" y="150" width="310" height="362" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="378" y="176" font-size="13" font-weight="700" fill="#475569">gateway</text>

  <rect x="386" y="192" width="270" height="76" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="521" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">JobService gRPC</text>
  <text x="521" y="240" text-anchor="middle" font-size="11.5" fill="#64748b">OpenJobStream / PullJobs</text>
  <text x="521" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">CompleteJob→标准命令</text>

  <rect x="386" y="308" width="270" height="76" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="521" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">GatewayJobHub</text>
  <text x="521" y="356" text-anchor="middle" font-size="11.5" fill="#64748b">streamsByType(会话表)</text>
  <text x="521" y="376" text-anchor="middle" font-size="11.5" fill="#64748b">长轮询挂起表</text>

  <rect x="386" y="424" width="270" height="64" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="521" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">GatewayJobStreamClient(actor)</text>
  <text x="521" y="472" text-anchor="middle" font-size="11.5" fill="#64748b">PUSH 受理 + 快照对账</text>

  <line x1="521" y1="268" x2="521" y2="306" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="521" y1="384" x2="521" y2="422" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- broker 面板 -->
  <rect x="868" y="150" width="576" height="374" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="888" y="176" font-size="13" font-weight="700" fill="#475569">broker</text>

  <rect x="896" y="196" width="250" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1021" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">标准命令通道 commandapi</text>
  <text x="1021" y="244" text-anchor="middle" font-size="11" fill="#64748b">ACTIVATE_REQUEST / COMPLETE</text>

  <rect x="896" y="310" width="250" height="76" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1021" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">JobStreamCoordinator(actor)</text>
  <text x="1021" y="358" text-anchor="middle" font-size="11.5" fill="#64748b">byType 扁平索引 + 单游标轮转</text>
  <text x="1021" y="378" text-anchor="middle" font-size="11.5" fill="#64748b">SWIM 快照合并 + 出站队列</text>

  <rect x="896" y="440" width="250" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1021" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">PushFailureFallback(actor)</text>
  <text x="1021" y="488" text-anchor="middle" font-size="11.5" fill="#b45309">分区写入器 + WITHDRAW 回退</text>

  <rect x="1170" y="230" width="250" height="60" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1295" y="256" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e1b4b">引擎状态机</text>
  <text x="1295" y="278" text-anchor="middle" font-size="11.5" fill="#475569">deliver / 批量激活 / 到期扫描</text>

  <rect x="1170" y="350" width="250" height="60" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1295" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">CoordinatorJobDeliveryPort</text>
  <text x="1295" y="398" text-anchor="middle" font-size="11" fill="#64748b">(引擎 JobDeliveryPort 端口实现)</text>

  <rect x="1210" y="460" width="170" height="48" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1295" y="490" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">raft state machine</text>

  <!-- client → gateway 接入 -->
  <line x1="246" y1="228" x2="382" y2="218" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="314" y="204" text-anchor="middle" font-size="12" fill="#475569">gRPC 流</text>

  <polyline points="246,328 316,328 316,252 380,252" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="324" y="300" font-size="12" fill="#475569">gRPC 长轮询</text>

  <!-- gateway → broker -->
  <line x1="656" y1="230" x2="892" y2="226" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="774" y="214" text-anchor="middle" font-size="12" fill="#475569">拉取/完成(标准命令)</text>

  <polyline points="656,454 744,454 744,348 892,348" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <text x="754" y="372" font-size="11.5" fill="#0f766e">①snapshot 对账</text>
  <text x="754" y="390" font-size="11.5" fill="#0f766e">②push(请求-应答)</text>
  <text x="754" y="408" font-size="11.5" fill="#0f766e">③job-ready 广播</text>

  <!-- broker 内部连线 -->
  <line x1="1021" y1="386" x2="1021" y2="438" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="1146,226 1158,226 1158,260 1166,260" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="1146,348 1158,348 1158,380 1166,380" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="1295" y1="348" x2="1295" y2="294" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="1420,260 1434,260 1434,484 1386,484" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 图例 -->
  <line x1="60" y1="576" x2="100" y2="576" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="108" y="580" font-size="11.5" fill="#475569">调用（gRPC 流 / 长轮询 / 标准命令）</text>
  <line x1="400" y1="576" x2="440" y2="576" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <text x="448" y="580" font-size="11.5" fill="#475569">cluster/messaging（job 专属 wire 触点）</text>
  <line x1="830" y1="576" x2="870" y2="576" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="878" y="580" font-size="11.5" fill="#475569">内部协作 / 组成</text>
</svg>
