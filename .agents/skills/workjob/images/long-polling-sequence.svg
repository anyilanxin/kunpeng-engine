<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 950" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="950" fill="#ffffff"/>
  <text x="590" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">③ 长轮询时序</text>
  <text x="590" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">标准命令通道全分区探测 · 空批挂起等广播唤醒</text>

  <!-- alt 分组框 -->
  <rect x="160" y="384" width="965" height="488" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 生命线 -->
  <line x1="170" y1="144" x2="170" y2="896" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="450" y1="144" x2="450" y2="896" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="730" y1="144" x2="730" y2="896" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1010" y1="144" x2="1010" y2="896" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 参与者 -->
  <rect x="100" y="96" width="140" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">client</text>
  <text x="170" y="136" text-anchor="middle" font-size="11" fill="#64748b">（PullJobs）</text>

  <rect x="375" y="96" width="150" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">GatewayJobHub</text>

  <rect x="655" y="96" width="150" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="730" y="117" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">BrokerClient</text>
  <text x="730" y="136" text-anchor="middle" font-size="11" fill="#64748b">→ commandapi</text>

  <rect x="905" y="96" width="210" height="48" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1010" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e1b4b">JobBatchActivateProcessor</text>

  <!-- W→H PullJobs -->
  <line x1="170" y1="190" x2="444" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="307" y="178" text-anchor="middle" font-size="11.5" fill="#475569">PullJobs(type, maxBatch, deadlineMs)</text>

  <!-- H→B 全分区请求 -->
  <line x1="450" y1="246" x2="724" y2="246" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="587" y="234" text-anchor="middle" font-size="11.5" fill="#475569">JobBatchActivateRequest × 每分区（并行）</text>

  <!-- B→P ACTIVATE -->
  <line x1="730" y1="302" x2="1004" y2="302" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="867" y="290" text-anchor="middle" font-size="11.5" fill="#475569">ACTIVATE_REQUEST → ACTIVATE 命令</text>

  <!-- P 自消息：扫描 READY -->
  <polyline points="1010,328 960,328 960,356 1004,356" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="948" y="346" text-anchor="end" font-size="11.5" fill="#475569">扫描 READY（分区内串行，无竞态）</text>

  <!-- alt 有 job -->
  <text x="176" y="408" font-size="12" font-weight="700" fill="#475569">alt 有 job</text>

  <polyline points="1010,430 960,430 960,458 1004,458" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="948" y="448" text-anchor="end" font-size="11.5" fill="#475569">ACTIVATED 事件 + 到期索引</text>

  <line x1="1010" y1="514" x2="736" y2="514" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="873" y="502" text-anchor="middle" font-size="11.5" fill="#475569">响应（JobInfo + deadline + worker）</text>

  <line x1="730" y1="570" x2="476" y2="570" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="603" y="558" text-anchor="middle" font-size="11.5" fill="#475569">首个非空批次胜出（迟到批次转交其他挂起请求）</text>

  <line x1="450" y1="626" x2="176" y2="626" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="313" y="614" text-anchor="middle" font-size="12" fill="#475569">PullResponse(jobs)</text>

  <!-- else 全分区空 -->
  <line x1="160" y1="660" x2="1125" y2="660" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="176" y="684" font-size="12" font-weight="700" fill="#475569">else 全分区空</text>

  <line x1="1010" y1="712" x2="476" y2="712" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="590" y="700" text-anchor="middle" font-size="12" fill="#475569">空批</text>

  <polyline points="450,738 510,738 510,766 456,766" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="522" y="756" font-size="12" fill="#475569">挂起（QUEUED）</text>

  <!-- Note over H -->
  <rect x="325" y="792" width="250" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="814" text-anchor="middle" font-size="11.5" fill="#854d0e">job-ready 广播到达 → 唤醒重探测；</text>
  <text x="450" y="836" text-anchor="middle" font-size="11.5" fill="#854d0e">挂起超时返回空批，client 立即重挂</text>
</svg>
