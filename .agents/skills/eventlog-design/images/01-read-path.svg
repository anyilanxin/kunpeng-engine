<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1560" height="640" fill="#ffffff"/>
  <text x="780" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">读路径（EventLogReaderImpl）</text>

  <rect x="60" y="200" width="260" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="237" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">seek(p) /</text>
  <text x="190" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">seekToNextEntry(p)</text>

  <line x1="322" y1="245" x2="396" y2="245" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="368" y="168" text-anchor="middle" font-size="11.5" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">store.seek(p) 后</text>
  <text x="368" y="188" text-anchor="middle" font-size="11.5" fill="#64748b" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">逐条推进至 entry ≥ p</text>

  <rect x="360" y="100" width="1100" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="376" y="126" font-size="13" font-weight="700" fill="#475569">EventLogReaderImpl</text>

  <rect x="400" y="210" width="250" height="90" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="525" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">peek 预读模型</text>
  <text x="525" y="271" text-anchor="middle" font-size="11" fill="#475569">(复用视图实例)</text>

  <line x1="652" y1="255" x2="716" y2="255" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="720" y="205" width="320" height="100" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="880" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">块内有下一条?</text>
  <text x="880" y="269" text-anchor="middle" font-size="11.5" fill="#854d0e">decoder.nextEntry()</text>

  <line x1="1042" y1="238" x2="1118" y2="210" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1064" y="216" font-size="12" fill="#475569">是</text>

  <rect x="1120" y="120" width="320" height="100" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1280" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">LoggedEntryImpl.wrap(block, dec)</text>
  <text x="1280" y="180" text-anchor="middle" font-size="11" fill="#475569">零拷贝视图</text>

  <line x1="1042" y1="276" x2="1118" y2="330" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1064" y="318" font-size="12" fill="#475569">否</text>

  <rect x="1120" y="340" width="320" height="100" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1280" y="373" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">storeReader.next()</text>
  <text x="1280" y="400" text-anchor="middle" font-size="11" fill="#475569">取下一块 + decoder.wrap</text>

  <line x1="1280" y1="442" x2="1280" y2="494" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1292" y="474" font-size="12" fill="#475569">无块</text>

  <rect x="1120" y="500" width="320" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1280" y="542" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">null (读到尾)</text>
</svg>
