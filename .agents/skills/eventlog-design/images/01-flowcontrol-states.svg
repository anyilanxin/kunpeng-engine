<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1560" height="600" fill="#ffffff"/>
  <text x="780" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">三态水位与线程契约（FlowController）</text>
  <text x="780" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">ACQUIRED → APPENDING → WRITTEN → COMMITTED，处理完成后释放窗口占位</text>

  <!-- 初始 -->
  <circle cx="80" cy="400" r="7" fill="#0f172a"/>
  <line x1="88" y1="400" x2="146" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="40" y="330" font-size="11.5" fill="#475569">tryAcquire (写线程, 并发)</text>
  <text x="40" y="350" font-size="11.5" fill="#64748b">仅 USER_COMMAND 受限</text>

  <rect x="150" y="360" width="160" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="407" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">ACQUIRED</text>

  <line x1="312" y1="400" x2="476" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="394" y="332" text-anchor="middle" font-size="11.5" fill="#475569">onAppend (提交路径, 升序串行)</text>
  <text x="394" y="354" text-anchor="middle" font-size="11.5" fill="#64748b">InflightRing.add + 时间戳</text>

  <rect x="480" y="360" width="160" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="407" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">APPENDING</text>

  <line x1="642" y1="400" x2="806" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="724" y="332" text-anchor="middle" font-size="11.5" fill="#475569">onWrite (raft 线程)</text>
  <text x="724" y="354" text-anchor="middle" font-size="11.5" fill="#64748b">markWritten + lastWritten</text>

  <rect x="810" y="360" width="160" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="890" y="407" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">WRITTEN</text>

  <line x1="972" y1="400" x2="1136" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1054" y="310" text-anchor="middle" font-size="11.5" fill="#475569">onCommit (raft 线程)</text>
  <text x="1054" y="332" text-anchor="middle" font-size="11.5" fill="#64748b">markCommitted + lastCommitted</text>
  <text x="1054" y="354" text-anchor="middle" font-size="11.5" fill="#64748b">BacklogThrottle 计入</text>

  <rect x="1140" y="360" width="180" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1230" y="407" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">COMMITTED</text>

  <!-- 终态 -->
  <circle cx="1462" cy="400" r="15" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="1462" cy="400" r="8.5" fill="#0f172a"/>

  <line x1="1322" y1="400" x2="1442" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1384" y="290" text-anchor="middle" font-size="11.5" fill="#475569">onProcessed (处理 actor, 单线程)</text>
  <text x="1384" y="312" text-anchor="middle" font-size="11.5" fill="#64748b">RTT 采样 → AIMD 窗口调整</text>
  <text x="1384" y="334" text-anchor="middle" font-size="11.5" fill="#64748b">释放窗口占位</text>

  <!-- 失败出口 -->
  <polyline points="560,442 560,520 1462,520 1462,419" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="890" y="488" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">onFailure / onAppendRolledBack</text>
  <text x="890" y="510" text-anchor="middle" font-size="11.5" fill="#b91c1c">释放全部占位, 不采样</text>
</svg>
