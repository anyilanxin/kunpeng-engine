<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 830" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1560" height="830" fill="#ffffff"/>
  <text x="780" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">端到端数据结构：磁盘 → 批帧 → 条目 → 载荷</text>
  <text x="780" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">一次 tryAppend 产生的数据在物理存储中的完整嵌套结构</text>

  <!-- Raft journal -->
  <rect x="70" y="110" width="540" height="660" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="86" y="136" font-size="13" font-weight="700" fill="#475569">Raft journal 段文件（cluster 模块, 零改动）</text>

  <rect x="100" y="156" width="480" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">段: {name}-{id}.log</text>
  <text x="340" y="210" text-anchor="middle" font-size="11" fill="#64748b">SBE 段头 + 索引条目流</text>

  <line x1="340" y1="232" x2="340" y2="264" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="100" y="272" width="480" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">journal 条目 #k</text>
  <text x="340" y="326" text-anchor="middle" font-size="11" fill="#64748b">(term, index, CRC)</text>

  <line x1="340" y1="348" x2="340" y2="380" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="100" y="388" width="480" height="120" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SerializedApplicationEntry</text>
  <text x="340" y="441" text-anchor="middle" font-size="11" fill="#475569">lowestPosition = 批帧 firstPosition</text>
  <text x="340" y="463" text-anchor="middle" font-size="11" fill="#475569">highestPosition = 批帧 lastPosition</text>
  <text x="340" y="485" text-anchor="middle" font-size="10.5" fill="#64748b">(Raft 按 ASQN 区间定位)</text>

  <line x1="340" y1="508" x2="340" y2="540" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="100" y="548" width="480" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="579" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">data = 批帧字节</text>
  <text x="340" y="602" text-anchor="middle" font-size="11" fill="#64748b">（不透明, raft 不解析）</text>

  <!-- DATA 与批帧同一字节 -->
  <line x1="582" y1="586" x2="694" y2="586" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <text x="638" y="572" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">同一字节</text>

  <!-- 批帧 -->
  <rect x="700" y="110" width="460" height="660" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="716" y="136" font-size="13" font-weight="700" fill="#475569">批帧 BatchFrame（本模块定义, magic 'EL'）</text>

  <rect x="720" y="156" width="420" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="930" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">帧头: EL 01 flags batchLength</text>
  <text x="930" y="210" text-anchor="middle" font-size="11" fill="#475569">(4B + varint)</text>

  <line x1="930" y1="232" x2="930" y2="260" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="720" y="268" width="420" height="104" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="930" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">批级字段:</text>
  <text x="930" y="320" text-anchor="middle" font-size="11" fill="#475569">firstPosition(uvarint) entryCount(uvarint)</text>
  <text x="930" y="342" text-anchor="middle" font-size="11" fill="#475569">sourcePosition(svarint) timestamp(uvarint)</text>

  <line x1="930" y1="372" x2="930" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="720" y="408" width="420" height="120" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="930" y="436" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">entry[0]: key(svarint) + flags(1B)</text>
  <text x="930" y="460" text-anchor="middle" font-size="11" fill="#475569">+ sourceIndex(svarint)</text>
  <text x="930" y="482" text-anchor="middle" font-size="11" fill="#475569">+ metadataLen + metadata 字节</text>
  <text x="930" y="504" text-anchor="middle" font-size="11" fill="#475569">+ valueLen + value 字节</text>

  <line x1="930" y1="528" x2="930" y2="556" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="720" y="564" width="420" height="68" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="930" y="605" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">entry[1]: ...</text>

  <line x1="930" y1="632" x2="930" y2="660" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="720" y="668" width="420" height="68" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="930" y="709" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">entry[n-1]: ...</text>

  <!-- 载荷 -->
  <rect x="1210" y="110" width="320" height="660" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="1226" y="136" font-size="13" font-weight="700" fill="#134e4a">载荷内嵌格式（透传不解析）</text>

  <rect x="1230" y="156" width="280" height="120" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1370" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">metadata = SBE 编码 RecordMetadata</text>
  <text x="1370" y="209" text-anchor="middle" font-size="11" fill="#0f766e">(recordType/valueType/lifeCycle/</text>
  <text x="1370" y="231" text-anchor="middle" font-size="11" fill="#0f766e">requestId/operationReference...)</text>

  <rect x="1230" y="316" width="280" height="120" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1370" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">value = structpack 帧的</text>
  <text x="1370" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">UnifiedRecordValue</text>
  <text x="1370" y="391" text-anchor="middle" font-size="11" fill="#0f766e">(id 升序 + 长度前缀值,</text>
  <text x="1370" y="411" text-anchor="middle" font-size="11" fill="#0f766e">见 structpack 模块)</text>

  <!-- entry[0] → 载荷 -->
  <polyline points="1142,450 1190,450 1190,216 1226,216" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <polyline points="1142,490 1174,490 1174,376 1226,376" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
</svg>
