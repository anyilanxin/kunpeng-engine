  <text x="756" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">metadata ‹16B›</text>
  <text x="756" y="496" text-anchor="middle" font-size="10.5" fill="#475569">SBE 字节, 透传</text>

  <rect x="857" y="432" width="130" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="865" y="448" font-size="10" fill="#94a3b8">0x20</text>
  <text x="922" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">valueLen = 48</text>
  <text x="922" y="496" text-anchor="middle" font-size="10.5" fill="#475569">30</text>

  <rect x="1003" y="432" width="190" height="96" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1011" y="448" font-size="10" fill="#94a3b8">0x21</text>
  <text x="1098" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">value ‹48B›</text>
  <text x="1098" y="496" text-anchor="middle" font-size="10.5" fill="#475569">structpack 帧字节, 透传</text>

  <!-- entry[1] -->
  <text x="47" y="568" font-size="12.5" font-weight="700" fill="#92400e">entry[1]（position=1002）</text>

  <rect x="47" y="576" width="130" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="55" y="592" font-size="10" fill="#94a3b8">0x51</text>
