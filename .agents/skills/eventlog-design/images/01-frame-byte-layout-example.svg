  <text x="454" y="618" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">sourceIndex = 0</text>
  <text x="454" y="638" text-anchor="middle" font-size="10.5" fill="#475569">00</text>
  <text x="454" y="658" text-anchor="middle" font-size="10.5" fill="#64748b">→ source = 1001+0 = 1001</text>

  <rect x="565" y="576" width="150" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="573" y="592" font-size="10" fill="#94a3b8">0x54</text>
  <text x="640" y="618" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">metadataLen = 16</text>
  <text x="640" y="640" text-anchor="middle" font-size="10.5" fill="#475569">10</text>

  <rect x="731" y="576" width="150" height="96" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="739" y="592" font-size="10" fill="#94a3b8">0x55</text>
  <text x="806" y="618" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">metadata ‹16B›</text>

  <rect x="897" y="576" width="130" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="905" y="592" font-size="10" fill="#94a3b8">0x65</text>
  <text x="962" y="618" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">valueLen = 32</text>
  <text x="962" y="640" text-anchor="middle" font-size="10.5" fill="#475569">20</text>

  <rect x="1043" y="576" width="150" height="96" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1051" y="592" font-size="10" fill="#94a3b8">0x66</text>
  <text x="1118" y="618" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">value ‹32B›</text>

  <text x="620" y="742" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">帧总长 = 134 B（载荷 112B，协议开销 22B）</text>
