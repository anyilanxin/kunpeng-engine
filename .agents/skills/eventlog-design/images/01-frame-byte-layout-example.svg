  <text x="696" y="360" text-anchor="middle" font-size="10.5" fill="#64748b">zigzag→1</text>

  <rect x="805" y="282" width="200" height="88" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
