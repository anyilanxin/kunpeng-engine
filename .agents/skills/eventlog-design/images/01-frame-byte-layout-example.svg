  <text x="905" y="342" text-anchor="middle" font-size="11" fill="#475569">DC 0B</text>
  <text x="905" y="360" text-anchor="middle" font-size="10.5" fill="#64748b">批级毫秒</text>

  <!-- entry[0] -->
  <text x="47" y="424" font-size="12.5" font-weight="700" fill="#92400e">entry[0]（position=1001）</text>

  <rect x="47" y="432" width="160" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
