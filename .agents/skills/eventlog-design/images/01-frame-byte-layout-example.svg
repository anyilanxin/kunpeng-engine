  <text x="512" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">entryCount = 2</text>
  <text x="512" y="350" text-anchor="middle" font-size="11" fill="#475569">02</text>

  <rect x="601" y="282" width="190" height="88" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
