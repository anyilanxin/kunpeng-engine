  <text x="414" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">sourceIndex = -1</text>
  <text x="414" y="496" text-anchor="middle" font-size="10.5" fill="#475569">01 · zigzag→1</text>

  <rect x="505" y="432" width="150" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="513" y="448" font-size="10" fill="#94a3b8">0x0F</text>
  <text x="580" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">metadataLen = 16</text>
  <text x="580" y="496" text-anchor="middle" font-size="10.5" fill="#475569">10</text>

  <rect x="671" y="432" width="170" height="96" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
