  <text x="112" y="640" text-anchor="middle" font-size="10.5" fill="#475569">54 · zigzag→84</text>

  <rect x="193" y="576" width="150" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
