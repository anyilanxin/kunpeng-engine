<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#ffffff"/>
  <text x="620" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">批帧字节布局实例（2 条目，可手工复算）</text>
  <text x="620" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">firstPosition=1001 · sourcePosition=-1 · timestamp=1500 · entry0 = {key:-1, flags:0, sourceIndex:-1, meta:16B, value:48B}</text>

  <!-- 帧头 -->
  <rect x="238" y="110" width="220" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="246" y="126" font-size="10" fill="#94a3b8">0x00</text>
  <text x="348" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">magic "EL"</text>
  <text x="348" y="170" text-anchor="middle" font-size="11" fill="#475569">45 4C</text>
  <text x="348" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">误定位/格式快速识别</text>

  <rect x="476" y="110" width="110" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="484" y="126" font-size="10" fill="#94a3b8">0x02</text>
  <text x="531" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">version</text>
  <text x="531" y="176" text-anchor="middle" font-size="11" fill="#475569">01</text>

  <rect x="604" y="110" width="180" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="612" y="126" font-size="10" fill="#94a3b8">0x03</text>
  <text x="694" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">flags</text>
  <text x="694" y="170" text-anchor="middle" font-size="11" fill="#475569">00</text>
  <text x="694" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">bit0 预留 CRC</text>

  <rect x="802" y="110" width="200" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="810" y="126" font-size="10" fill="#94a3b8">0x04</text>
  <text x="902" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">batchLength = 128</text>
  <text x="902" y="170" text-anchor="middle" font-size="11" fill="#475569">80 01 · uvarint</text>
  <text x="902" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">本字段之后到帧尾</text>

  <line x1="902" y1="198" x2="902" y2="242" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGray)"/>

