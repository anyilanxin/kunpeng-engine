<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 850" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1320" height="850" fill="#ffffff"/>
  <text x="660" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">运行期数据结构（写路径内存视图）</text>

  <!-- PositionSequencer -->
  <rect x="70" y="100" width="560" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="86" y="126" font-size="13" font-weight="700" fill="#475569">PositionSequencer（每分区 1 个）</text>

  <rect x="100" y="150" width="250" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="225" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">AtomicLong nextPosition</text>
  <text x="225" y="207" text-anchor="middle" font-size="11" fill="#475569">（CAS 预约, 无锁）</text>

  <rect x="380" y="150" width="230" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="495" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">volatile submittedThrough</text>
  <text x="495" y="207" text-anchor="middle" font-size="11" fill="#475569">（watermark 提交链头）</text>

  <line x1="225" y1="252" x2="225" y2="304" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="237" y="282" font-size="12" fill="#475569">getAndAdd(n)</text>
  <line x1="495" y1="252" x2="495" y2="304" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="507" y="282" font-size="12" fill="#475569">slotOfFirst(watermark+1)</text>

  <!-- PendingAppendQueue -->
  <rect x="70" y="310" width="560" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="86" y="336" font-size="13" font-weight="700" fill="#475569">PendingAppendQueue（开放寻址槽位表, 容量 64）</text>

  <rect x="100" y="350" width="500" height="120" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="350" y="382" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">slot: CLAIMED→RESERVED→READY(帧|null)→SUBMITTING→EMPTY</text>
  <text x="350" y="410" text-anchor="middle" font-size="11.5" fill="#475569">firstPosition / lastPosition / deadline(5s 看门狗)</text>

  <!-- FlowController -->
  <rect x="700" y="100" width="540" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="716" y="126" font-size="13" font-weight="700" fill="#475569">FlowController</text>

  <rect x="730" y="150" width="480" height="130" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="970" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">InflightRing[1024]</text>
  <text x="970" y="202" text-anchor="middle" font-size="11" fill="#475569">idx = lastPosition &amp; 1023</text>
  <text x="970" y="224" text-anchor="middle" font-size="11" fill="#475569">{position, appendedAtNanos, state:</text>
  <text x="970" y="246" text-anchor="middle" font-size="11" fill="#475569">APPENDING→WRITTEN→COMMITTED}</text>

  <line x1="970" y1="282" x2="970" y2="304" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="982" y="298" font-size="12" fill="#475569">RTT 采样</text>

  <rect x="730" y="310" width="480" height="76" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="970" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">AimdWindow</text>
  <text x="970" y="364" text-anchor="middle" font-size="11" fill="#475569">(volatile window + AtomicInteger inflight)</text>

  <rect x="730" y="416" width="480" height="76" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="970" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">TokenBucket</text>
  <text x="970" y="470" text-anchor="middle" font-size="11" fill="#475569">(long tokensMicro 定点)</text>

  <!-- QUEUE → RING -->
  <polyline points="632,410 664,410 664,215 726,215" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="652" y="316" font-size="12" fill="#475569" transform="rotate(-90 652 316)">onAppend 登记</text>

  <!-- AIMD/TB → GATE -->
  <polyline points="1212,348 1272,348 1272,620 1094,620" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="1260" y="480" font-size="12" fill="#475569" transform="rotate(-90 1260 480)">仅 USER_COMMAND</text>
  <line x1="970" y1="494" x2="970" y2="576" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>

  <rect x="830" y="580" width="260" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="960" y="627" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">tryAcquire 准入</text>

  <!-- 帧缓冲 → 存储 -->
  <line x1="350" y1="502" x2="350" y2="556" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="70" y="560" width="560" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="596" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">ExpandableArrayBuffer 帧缓冲</text>
  <text x="350" y="622" text-anchor="middle" font-size="11.5" fill="#64748b">（每批独立自持 — Raft 延迟序列化持有引用）</text>

  <line x1="350" y1="662" x2="350" y2="716" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="365" y="695" font-size="12" fill="#475569">store.append (first, last, frame)</text>

  <rect x="70" y="720" width="560" height="84" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="350" y="753" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6b21a8">EventStore SPI → Raft</text>
</svg>
