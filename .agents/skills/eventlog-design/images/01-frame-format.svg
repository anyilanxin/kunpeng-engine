<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1520" height="640" fill="#ffffff"/>
  <text x="760" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">批帧格式 v1（字段布局）</text>
  <text x="760" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">小端 LEB128 varint、无对齐无 padding（Raft journal 顺序消费，无需对齐）</text>

  <!-- 帧头（偏移固定） -->
  <line x1="445" y1="100" x2="445" y2="118" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="445" y="94" text-anchor="middle" font-size="11" fill="#64748b">0x00</text>
  <line x1="599" y1="100" x2="599" y2="118" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="599" y="94" text-anchor="middle" font-size="11" fill="#64748b">0x02</text>
  <line x1="733" y1="100" x2="733" y2="118" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="733" y="94" text-anchor="middle" font-size="11" fill="#64748b">0x03</text>
  <line x1="897" y1="100" x2="897" y2="118" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="897" y="94" text-anchor="middle" font-size="11" fill="#64748b">0x04</text>

  <rect x="439" y="120" width="130" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="504" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">magic</text>
  <text x="504" y="172" text-anchor="middle" font-size="11" fill="#475569">2B · 0x45 0x4C</text>
  <text x="504" y="192" text-anchor="middle" font-size="10.5" fill="#64748b">("EL")</text>

  <rect x="593" y="120" width="110" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="648" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">version</text>
  <text x="648" y="178" text-anchor="middle" font-size="11" fill="#475569">1B · 0x01</text>

  <rect x="727" y="120" width="140" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="797" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">flags</text>
  <text x="797" y="172" text-anchor="middle" font-size="11" fill="#475569">1B</text>
  <text x="797" y="192" text-anchor="middle" font-size="10.5" fill="#64748b">bit0 预留 CRC</text>

  <rect x="891" y="120" width="190" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="986" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">batchLength</text>
  <text x="986" y="172" text-anchor="middle" font-size="11" fill="#475569">uvarint32</text>
  <text x="986" y="192" text-anchor="middle" font-size="10.5" fill="#64748b">本字段之后到帧尾的字节数</text>

  <text x="439" y="228" font-size="11" fill="#b45309">注意不可用 "KP"（structpack 已占）</text>

  <line x1="986" y1="204" x2="986" y2="260" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGray)"/>

  <!-- batchLength 计量区域 -->
  <rect x="80" y="264" width="1380" height="324" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="100" y="292" font-size="13" font-weight="700" fill="#b45309">以下计入 batchLength（varint 变长，偏移不固定）</text>

  <!-- 批级字段 -->
  <rect x="144" y="310" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="269" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">firstPosition</text>
  <text x="269" y="360" text-anchor="middle" font-size="11" fill="#475569">uvarint64</text>
  <text x="269" y="382" text-anchor="middle" font-size="11" fill="#64748b">批首 position（恒 ≥1）</text>

  <rect x="418" y="310" width="200" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="518" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">entryCount</text>
  <text x="518" y="368" text-anchor="middle" font-size="11" fill="#475569">uvarint32</text>

  <rect x="642" y="310" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="767" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">sourcePosition</text>
  <text x="767" y="360" text-anchor="middle" font-size="11" fill="#475569">svarint64</text>
  <text x="767" y="382" text-anchor="middle" font-size="11" fill="#64748b">批级源 position（-1 = 无）</text>

  <rect x="916" y="310" width="280" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="1056" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">timestamp</text>
  <text x="1056" y="360" text-anchor="middle" font-size="11" fill="#475569">uvarint64</text>
  <text x="1056" y="382" text-anchor="middle" font-size="11" fill="#64748b">批级毫秒时间戳（同批同时间戳）</text>

  <!-- entry 区 -->
  <text x="770" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">entry[entryCount]:</text>
  <rect x="110" y="452" width="180" height="104" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">key</text>
  <text x="200" y="504" text-anchor="middle" font-size="11" fill="#475569">svarint64</text>
  <text x="200" y="526" text-anchor="middle" font-size="11" fill="#64748b">-1 = null key</text>

  <rect x="310" y="452" width="200" height="104" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="410" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">entryFlags</text>
  <text x="410" y="504" text-anchor="middle" font-size="11" fill="#475569">1B</text>
  <text x="410" y="526" text-anchor="middle" font-size="11" fill="#64748b">bit0 = skipProcessing</text>

  <rect x="530" y="452" width="260" height="104" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="660" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">sourceIndex</text>
  <text x="660" y="504" text-anchor="middle" font-size="11" fill="#475569">svarint32</text>
  <text x="660" y="526" text-anchor="middle" font-size="11" fill="#64748b">-1 = 无；批内回指（见 §3.1）</text>

  <rect x="810" y="452" width="300" height="104" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="960" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">metadataLen</text>
  <text x="960" y="516" text-anchor="middle" font-size="11" fill="#475569">uvarint32 + bytes</text>

  <rect x="1130" y="452" width="300" height="104" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1280" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">valueLen</text>
  <text x="1280" y="516" text-anchor="middle" font-size="11" fill="#475569">uvarint32 + bytes</text>
</svg>
