<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="360" fill="#ffffff"/>
  <text x="560" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">多写者并发：可并行区分析</text>
  <text x="560" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">预约（CAS，纳秒级临界区）与序列化完全并行，仅提交段（Raft 入队）经监视器串行</text>

  <rect x="80" y="120" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="162" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">写者A</text>

  <rect x="80" y="230" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="272" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">写者B</text>

  <line x1="242" y1="155" x2="356" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="242" y1="265" x2="356" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="360" y="160" width="340" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="530" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">CAS 预约 + 序列化</text>
  <text x="530" y="242" text-anchor="middle" font-size="12.5" fill="#475569">（并行, 各 ≈250ns）</text>

  <line x1="702" y1="225" x2="796" y2="225" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="800" y="160" width="280" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="940" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">提交监视器</text>
  <text x="940" y="242" text-anchor="middle" font-size="12.5" fill="#b45309">≈100ns 窗口</text>
</svg>
