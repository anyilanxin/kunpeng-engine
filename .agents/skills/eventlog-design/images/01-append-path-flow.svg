<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1380" fill="#ffffff"/>
  <text x="750" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">写入路径流程图（无锁定序器）</text>
  <text x="750" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">快路径：预约（1 次 CAS）→ 序列化（无锁区）→ drain → append；synchronized 仅覆盖已就绪槽位的逐个提交</text>

  <!-- 主脊 -->
  <rect x="350" y="100" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">tryAppend(ctx, entries, sourcePos)</text>

  <line x1="520" y1="164" x2="520" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="430" y="200" width="180" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="520" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#713f12">closed?</text>

  <line x1="520" y1="260" x2="520" y2="290" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="532" y="280" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">否</text>

  <rect x="380" y="296" width="300" height="76" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="530" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">空批 / 提交链满 /</text>
  <text x="530" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">流控拒绝?</text>

  <line x1="520" y1="372" x2="520" y2="402" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="532" y="392" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">否</text>

  <rect x="350" y="408" width="340" height="80" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="520" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">first = nextPosition.getAndAdd(n)</text>
  <text x="520" y="464" text-anchor="middle" font-size="11" fill="#475569">（CAS 预约, 无锁）</text>

  <line x1="520" y1="488" x2="520" y2="518" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="350" y="524" width="340" height="80" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="520" y="556" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">flowControl.onAppend(first, last, n)</text>
  <text x="520" y="580" text-anchor="middle" font-size="11" fill="#475569">（在途环登记）</text>

  <line x1="520" y1="604" x2="520" y2="634" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="350" y="640" width="340" height="80" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="520" y="672" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">pending.reserve(first, last, deadline)</text>
  <text x="520" y="696" text-anchor="middle" font-size="11" fill="#475569">（占位, 5s 看门狗）</text>

  <line x1="520" y1="720" x2="520" y2="750" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="400" y="756" width="240" height="76" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="520" y="788" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">帧序列化</text>
  <text x="520" y="810" text-anchor="middle" font-size="11.5" fill="#854d0e">(calculateLength + serialize)</text>

  <line x1="520" y1="832" x2="520" y2="860" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="532" y="851" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">成功</text>

  <rect x="350" y="866" width="340" height="62" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="520" y="903" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">fulfill(frame)</text>

  <line x1="520" y1="928" x2="520" y2="958" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="350" y="964" width="340" height="60" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="520" y="1000" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">drain()</text>

  <line x1="520" y1="1024" x2="520" y2="1054" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="370" y="1060" width="320" height="76" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="530" y="1105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#713f12">watermark+1 槽位状态?</text>

  <!-- 拒绝分支 -->
  <line x1="612" y1="230" x2="816" y2="230" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="714" y="220" text-anchor="middle" font-size="12" fill="#b91c1c">是</text>
  <rect x="820" y="200" width="280" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="960" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Rejected(CLOSED)</text>

  <line x1="682" y1="334" x2="816" y2="334" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="749" y="324" text-anchor="middle" font-size="12" fill="#b91c1c">是</text>
  <rect x="820" y="302" width="320" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="980" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Rejected(WINDOW / RATE / INVALID)</text>

  <line x1="642" y1="794" x2="816" y2="794" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="729" y="782" text-anchor="middle" font-size="12" fill="#b91c1c">超限/异常</text>
  <rect x="820" y="748" width="340" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="990" y="784" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">fulfill(null) + 流控回滚 + drain</text>
  <text x="990" y="810" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">→ Rejected(INVALID)</text>

  <!-- 多写者交错 -->
  <line x1="692" y1="898" x2="816" y2="902" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <rect x="820" y="866" width="440" height="104" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1040" y="900" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">多写者交错: 后到 position 先序列化完</text>
  <text x="1040" y="926" text-anchor="middle" font-size="11.5" fill="#64748b">→ PARKED 等待, tryAppend 立即返回 Appended</text>
  <line x1="818" y1="972" x2="696" y2="972" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- K 分支 -->
  <line x1="400" y1="1136" x2="330" y2="1214" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="258" y="1160" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">READY(帧)</text>

  <line x1="480" y1="1136" x2="560" y2="1214" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="430" y="1166" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">READY(null)</text>

  <line x1="600" y1="1136" x2="946" y2="1214" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="862" y="1182" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">RESERVED 超期</text>

  <line x1="660" y1="1136" x2="1266" y2="1214" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="920" y="1152" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">RESERVED 未超期</text>

  <polyline points="692,1100 1440,1100 1440,1270 1414,1270" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="770" y="1090" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">EMPTY</text>

  <!-- 回环 -->
  <line x1="680" y1="1216" x2="680" y2="1140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aGray)"/>
  <polyline points="150,1216 150,1100 366,1100" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aGray)"/>
  <line x1="798" y1="1270" x2="776" y2="1270" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- 结果盒 -->
  <rect x="60" y="1220" width="380" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="1258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">store.append(first, last, frame)</text>
  <text x="250" y="1284" text-anchor="middle" font-size="12" fill="#475569">→ watermark = last</text>

  <rect x="470" y="1220" width="300" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="1258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">烧毁推进</text>
  <text x="620" y="1284" text-anchor="middle" font-size="12" fill="#b45309">watermark = last</text>

  <rect x="800" y="1220" width="300" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="950" y="1258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">看门狗烧毁</text>
  <text x="950" y="1284" text-anchor="middle" font-size="12" fill="#b45309">(log.warn + metrics)</text>

  <rect x="1130" y="1220" width="280" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1270" y="1252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">停止, 等写线程</text>
  <text x="1270" y="1278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">fulfill</text>
</svg>
