<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 520" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1360" height="520" fill="#ffffff"/>
  <text x="680" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">槽位状态机（PendingAppendQueue）</text>

  <!-- note -->
  <rect x="400" y="84" width="360" height="126" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="420" y="114" font-size="12" font-weight="700" fill="#92400e">看门狗: 超期未 fulfill</text>
  <text x="420" y="138" font-size="12" fill="#b45309">→ drain 强制 fulfill(null) 烧毁</text>
  <text x="420" y="162" font-size="12" fill="#b45309">（防写线程死亡导致</text>
  <text x="420" y="186" font-size="12" fill="#b45309">watermark 永久停滞）</text>
  <line x1="580" y1="212" x2="560" y2="272" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 初始 -->
  <circle cx="100" cy="316" r="7" fill="#0f172a"/>
  <line x1="108" y1="316" x2="156" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="160" y="276" width="160" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="323" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">EMPTY</text>

  <line x1="322" y1="316" x2="476" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="399" y="280" text-anchor="middle" font-size="11.5" fill="#475569">reserve() 预占用位</text>
  <text x="399" y="300" text-anchor="middle" font-size="11.5" fill="#64748b">(deadline = now + 5s)</text>

  <rect x="480" y="276" width="160" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="323" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">RESERVED</text>

  <path d="M 560,274 Q 720,212 878,274" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="720" y="230" text-anchor="middle" font-size="12" fill="#475569">fulfill(frame) 帧就绪</text>

  <path d="M 560,358 Q 720,422 878,358" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="720" y="416" text-anchor="middle" font-size="12" fill="#475569">fulfill(null) 烧毁标记</text>

  <rect x="800" y="276" width="160" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="880" y="323" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">READY</text>

  <line x1="962" y1="316" x2="1116" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1039" y="298" text-anchor="middle" font-size="12" fill="#475569">drain() take()</text>

  <rect x="1120" y="276" width="160" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1200" y="323" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">SUBMITTING</text>

  <polyline points="1200,358 1200,452 240,452 240,362" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="720" y="444" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">free() 提交/烧毁完成</text>
</svg>
