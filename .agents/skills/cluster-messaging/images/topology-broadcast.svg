<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
  <text x="560" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">拓扑广播：业务端口如何被全集群知道</text>
  <text x="560" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">BrokerInfo 实体经集群面拓扑服务发布 · 各节点据此解析业务地址 · 停机逆序摘除</text>

  <!-- broker 启动侧 -->
  <rect x="60" y="100" width="440" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="124" font-size="13" font-weight="700" fill="#475569">broker 启动</text>

  <rect x="90" y="142" width="380" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">BusinessMessagingServiceStep</text>

  <line x1="280" y1="198" x2="280" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="90" y="240" width="380" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">service.start()</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#64748b">localBroker().addPort(CommPortType.BUSINESS, 业务端口)</text>

  <line x1="280" y1="324" x2="280" y2="362" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="90" y="366" width="380" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="394" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">topologyManager.publishBroadcast()</text>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#64748b">（BrokerInfo 实体经集群面拓扑服务发布）</text>

  <!-- 广播扩散 -->
  <text x="538" y="398" text-anchor="middle" font-size="12" fill="#0f766e" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">集群面拓扑服务发布</text>
  <line x1="470" y1="408" x2="636" y2="408" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>

  <!-- 各节点 -->
  <rect x="610" y="320" width="450" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="626" y="344" font-size="13" font-weight="700" fill="#475569">各节点</text>

  <rect x="640" y="360" width="390" height="116" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="835" y="386" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">DefaultClusterTopologyService</text>
  <text x="835" y="410" text-anchor="middle" font-size="11" fill="#64748b">businessAddressOf(member, brokerInfo)</text>
  <text x="835" y="430" text-anchor="middle" font-size="11" fill="#64748b">= member.address().host() + ports[BUSINESS]</text>
  <text x="835" y="452" text-anchor="middle" font-size="11" fill="#b45309">（未广播端口 → null）</text>

  <line x1="835" y1="476" x2="835" y2="510" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="680" y="514" width="310" height="72" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="835" y="542" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134e4a">供发送方 getPartitionBusinessAddress</text>
  <text x="835" y="564" text-anchor="middle" font-size="11.5" fill="#134e4a">寻址（链路 1）</text>

  <!-- 停机逆序 -->
  <rect x="60" y="500" width="300" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="80" y="526" font-size="11" font-weight="700" fill="#92400e">停机逆序：先摘端口注册并广播，</text>
  <text x="80" y="548" font-size="11" fill="#92400e">再停业务面服务（见 shutdownInternal）</text>
</svg>
