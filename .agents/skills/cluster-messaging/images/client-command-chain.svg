<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1420" height="540" fill="#ffffff"/>
  <text x="710" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">客户端命令调用链（command API 主链路）</text>
  <text x="710" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">gRPC（HTTP/2 · TCP 2024）接入 → 集群面 Aeron（UDP）转发 → broker 业务面（2026）接收 → 响应原路返回</text>

  <!-- client SDK -->
  <rect x="50" y="130" width="180" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">client SDK</text>

  <!-- 接入面箭头 -->
  <text x="305" y="134" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">gRPC（HTTP/2，TCP）</text>
  <text x="305" y="152" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">端口 2024</text>
  <line x1="230" y1="162" x2="416" y2="162" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- gateway 面板 -->
  <rect x="390" y="100" width="640" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="406" y="124" font-size="13" font-weight="700" fill="#475569">gateway（网关接入面）</text>

  <rect x="420" y="140" width="230" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="535" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">GrpcXxxServiceImpl</text>

  <line x1="535" y1="204" x2="535" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="420" y="240" width="230" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="535" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">BusinessCommandClient</text>

  <line x1="650" y1="272" x2="686" y2="272" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="690" y="240" width="310" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="845" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">BusinessBrokerPlane.resolve()</text>

  <line x1="845" y1="304" x2="845" y2="324" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="420" y="324" width="580" height="104" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="348" font-size="11" fill="#92400e">partitionId 随机 → 有 leader 的分区随机挑</text>
  <text x="440" y="368" font-size="11" fill="#92400e">key → decodeResourceId → getPartitionBySourceId</text>
  <text x="440" y="388" font-size="11" fill="#92400e">目标 = topologyService.getPartitionBusinessAddress(分区 leader 主机 + 业务端口)</text>
  <text x="440" y="408" font-size="11" fill="#92400e">topic = TopicUtils.getTopicName(RecordType.COMMAND_API, partitionId)</text>

  <!-- 集群面 Aeron 转发 -->
  <text x="1088" y="226" text-anchor="middle" font-size="12" fill="#0f766e" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">集群面</text>
  <text x="1088" y="244" text-anchor="middle" font-size="12" fill="#0f766e" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">Aeron（UDP）</text>
  <line x1="1030" y1="253" x2="1146" y2="253" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>

  <!-- broker 业务面 -->
  <rect x="1150" y="210" width="220" height="86" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1260" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">broker 业务面接收</text>
  <text x="1260" y="264" text-anchor="middle" font-size="11" fill="#64748b">（业务面 · 端口 2026）</text>

  <line x1="1260" y1="296" x2="1260" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="1150" y="344" width="220" height="60" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1260" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">引擎处理</text>

  <!-- 响应原路返回 -->
  <polyline points="1260,404 1260,500 140,500 140,198" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="705" y="492" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">响应原路返回</text>
</svg>
