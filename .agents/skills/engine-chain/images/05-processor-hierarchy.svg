<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LogEventProcessor 接口层级</text>
  <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">分发依据 lifeCycle.processIndex() —— LogEventProcessors 内部为 LogEventProcessor[RecordProcessIndex.size()] 数组</text>

  <rect x="250" y="100" width="400" height="104" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">LogEventProcessor&lt;T&gt;</text>
  <text x="450" y="160" text-anchor="middle" font-size="12" fill="#475569">基接口：valueType() + valueLifeCycles()</text>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#475569">+ processRecord(record)</text>

  <line x1="450" y1="204" x2="450" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#aGray)"/>

  <rect x="250" y="244" width="400" height="104" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="450" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">LogEventProcessorSingleState&lt;T&gt;</text>
  <text x="450" y="304" text-anchor="middle" font-size="12" fill="#475569">单状态便捷接口：</text>
  <text x="450" y="324" text-anchor="middle" font-size="12" fill="#475569">只声明 valueLifeCycle() 一个标记</text>
</svg>
