<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">actor 相位机与关闭语义</text>
  <text x="700" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">相位推进发生在排空点（drain 末尾），钩子作为 LIFECYCLE 信封逐级触发</text>

  <!-- 初始态 -->
  <circle cx="48" cy="194" r="7" fill="#0f172a"/>
  <line x1="55" y1="194" x2="96" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- 主链状态 -->
  <rect x="100" y="170" width="150" height="48" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="175" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CREATED</text>

  <rect x="470" y="170" width="150" height="48" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="545" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">STARTING</text>

  <rect x="810" y="170" width="150" height="48" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="885" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">STARTED</text>

  <rect x="1180" y="170" width="150" height="48" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1255" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">FAILED</text>

  <!-- CREATED → STARTING -->
  <line x1="250" y1="194" x2="466" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="358" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">submitActor</text>
  <text x="358" y="248" text-anchor="middle" font-size="12" fill="#475569">（onScheduled + LIFECYCLE 信封）</text>

  <!-- STARTING → STARTED -->
  <line x1="620" y1="194" x2="806" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="713" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">onActorStarting 执行完</text>
  <text x="713" y="248" text-anchor="middle" font-size="12" fill="#475569">（complete startingFuture）</text>

  <!-- STARTED → FAILED（错误链） -->
  <line x1="960" y1="194" x2="1176" y2="194" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="1068" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">任意相位异常</text>
  <text x="1068" y="248" text-anchor="middle" font-size="12" fill="#b91c1c">（非 STARTED）</text>

  <!-- STARTED → CLOSE_REQUESTED -->
  <line x1="885" y1="218" x2="885" y2="446" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="897" y="336" font-size="12" font-weight="700" fill="#475569">close 请求 job</text>

  <rect x="765" y="450" width="240" height="48" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="885" y="479" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">CLOSE_REQUESTED</text>

  <!-- CLOSE_REQUESTED → CLOSING -->
  <line x1="1005" y1="474" x2="1136" y2="474" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1070" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">排空后</text>
  <text x="1070" y="516" text-anchor="middle" font-size="12" fill="#475569">（onActorClosing）</text>

  <rect x="1140" y="450" width="160" height="48" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1220" y="479" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CLOSING</text>

  <!-- CLOSING → CLOSED -->
  <line x1="1220" y1="498" x2="1220" y2="676" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1232" y="570" font-size="12" font-weight="700" fill="#475569">排空后（onActorClosed</text>
  <text x="1232" y="588" font-size="12" fill="#475569">+ 清订阅 + 清队列）</text>

  <!-- CLOSED 终态（双环） -->
  <rect x="1135" y="680" width="170" height="60" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="1143" y="688" width="154" height="44" rx="10" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="1220" y="715" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CLOSED</text>

  <!-- CREATED → CLOSED（closeAsync 直达） -->
  <polyline points="175,218 175,710 1131,710" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="653" y="696" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">closeAsync 直接终态（从未提交）</text>
</svg>
