<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#ffffff"/>
  <text x="620" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">wakeTickets 防丢唤醒</text>
  <text x="620" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">volatile 同步全序保证：提交者与 owner 两侧总有一侧负责入队——丢唤醒协议上不可能</text>

  <!-- 提交者面板 -->
  <rect x="60" y="100" width="300" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="126" font-size="13" font-weight="700" fill="#475569">提交者</text>

  <rect x="100" y="156" width="220" height="52" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="210" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">offer 入队</text>

  <line x1="210" y1="208" x2="210" y2="248" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>

  <rect x="100" y="252" width="220" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="210" y="279" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">wakeTickets</text>
  <text x="210" y="299" text-anchor="middle" font-size="11.5" fill="#0f766e">incrementAndGet()</text>

  <line x1="210" y1="316" x2="210" y2="364" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="100" y="368" width="220" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="210" y="395" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">gate CAS</text>
  <text x="210" y="415" text-anchor="middle" font-size="11.5" fill="#0f766e">WAITING→WAKING_UP</text>

  <!-- Owner 面板 -->
  <rect x="460" y="100" width="730" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="476" y="126" font-size="13" font-weight="700" fill="#475569">Owner（drain 循环）</text>

  <rect x="500" y="156" width="250" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="625" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ticketsAtStart = 票快照</text>
  <text x="625" y="204" text-anchor="middle" font-size="11.5" fill="#475569">（drain 起点）</text>

  <line x1="625" y1="220" x2="625" y2="268" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="500" y="272" width="250" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="625" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">排空全部 job</text>

  <rect x="840" y="156" width="230" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="955" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">gate.trySleep</text>

  <line x1="955" y1="212" x2="955" y2="254" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <polygon points="955,258 1075,312 955,366 835,312" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="955" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">票变化？</text>

  <line x1="835" y1="312" x2="835" y2="416" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="823" y="372" text-anchor="end" font-size="12" font-weight="700" fill="#475569">是</text>

  <line x1="1075" y1="312" x2="1075" y2="416" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1087" y="372" font-size="12" font-weight="700" fill="#475569">否</text>

  <rect x="745" y="420" width="180" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="835" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">自行重新入队</text>

  <rect x="985" y="420" width="180" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1075" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">安全休眠</text>
</svg>
