<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1560" fill="#ffffff"/>
  <text x="640" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">业务面 sink 滞后背压 · 处理流程（闭环反馈）</text>
  <text x="640" y="70" text-anchor="middle" font-size="13" fill="#64748b">写入侧准入拦截 · 排空侧 sink 确认位置推进后自动重开 · 拒绝快速失败可重试</text>

  <!-- 调用方 -->
  <rect x="260" y="88" width="300" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="410" y="114" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">业务系统 / 客户端 SDK</text>
  <text x="410" y="138" text-anchor="middle" font-size="12" fill="#64748b">收到可重试失败 → 退避重试</text>

  <line x1="410" y1="152" x2="410" y2="234" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- gateway -->
  <text x="200" y="194" font-size="13.5" font-weight="700" fill="#1d4ed8">gateway（业务面）</text>
  <rect x="200" y="200" width="420" height="120" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="230" y="240" width="360" height="60" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="410" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">gRPC / REST 接口</text>
  <text x="410" y="288" text-anchor="middle" font-size="11.5" fill="#64748b">业务面命令：创建流程实例 / 完成 Job / 取消实例 …</text>

  <line x1="410" y1="300" x2="410" y2="408" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- broker -->
  <text x="180" y="352" font-size="13.5" font-weight="700" fill="#334155">broker 业务面（每分区 actor）</text>
  <text x="884" y="384" text-anchor="end" font-size="12.5" font-style="italic" fill="#64748b">CommandApiHandleImpl.handleRequest</text>
  <rect x="180" y="360" width="720" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ① -->
  <rect x="260" y="412" width="300" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="410" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">① 磁盘水位检查</text>
  <text x="410" y="458" text-anchor="middle" font-size="11.5" fill="#854d0e">isDiskSpaceAvailable？</text>
  <line x1="410" y1="472" x2="410" y2="510" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="420" y="496" font-size="12" fill="#64748b">可用</text>

  <!-- ② gate -->
  <rect x="260" y="516" width="300" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="492" y="506" width="52" height="22" rx="6" fill="#ea580c"/>
  <text x="518" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">新增</text>
  <text x="410" y="542" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9a3412">② SinkBackpressureGate</text>
  <text x="410" y="564" text-anchor="middle" font-size="11" fill="#9a3412">lag = lastWrittenPosition − lowestSinkPosition</text>
  <text x="410" y="584" text-anchor="middle" font-size="11.5" fill="#c2410c">双阈值迟滞：放行 ⇄ 拒绝</text>
  <line x1="410" y1="596" x2="410" y2="634" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="420" y="620" font-size="12" fill="#64748b">放行</text>

  <!-- ③ -->
  <rect x="260" y="640" width="300" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="410" y="664" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">③ canAppend 在途窗口探测</text>
  <text x="410" y="686" text-anchor="middle" font-size="11.5" fill="#854d0e">AIMD 流控（现有机制）</text>
  <line x1="410" y1="700" x2="410" y2="738" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="420" y="724" font-size="12" fill="#64748b">可写</text>

  <!-- write -->
  <rect x="260" y="744" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="768" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">tryAppend（USER_COMMAND）</text>
  <text x="410" y="790" text-anchor="middle" font-size="11.5" fill="#64748b">写入 eventlog</text>

  <!-- 信号源 -->
  <text x="750" y="628" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0f766e">滞后信号源（每分区）</text>
  <rect x="630" y="636" width="240" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="750" y="660" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">lastWrittenPosition</text>
  <text x="750" y="680" text-anchor="middle" font-size="11" fill="#0f766e">EventLog.getFlowControl() 原子读</text>
  <text x="750" y="698" text-anchor="middle" font-size="11" fill="#0f766e">每次准入实时读取</text>
  <rect x="630" y="716" width="240" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="750" y="740" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">lowestSinkPosition</text>
  <text x="750" y="760" text-anchor="middle" font-size="11" fill="#0f766e">SinkRepository 最低确认位置</text>
  <text x="750" y="778" text-anchor="middle" font-size="11" fill="#0f766e">volatile + TTL 缓存</text>
  <line x1="630" y1="671" x2="568" y2="558" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <line x1="630" y1="751" x2="568" y2="580" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>

  <!-- 拒绝路径 -->
  <line x1="560" y1="536" x2="952" y2="536" stroke="#dc2626" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="757" y="526" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">lag ≥ rejectBacklog（默认 50,000）</text>
  <text x="757" y="556" text-anchor="middle" font-size="11" fill="#b91c1c">① 磁盘不可用 / ③ 窗口耗尽 → 同走此失败路径</text>

  <rect x="960" y="516" width="240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1080" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">errorResponse（code）</text>
  <text x="1080" y="564" text-anchor="middle" font-size="11.5" fill="#b91c1c">code=2 · 立即回失败应答</text>
  <text x="1080" y="584" text-anchor="middle" font-size="11.5" fill="#b91c1c">不悬挂、不等超时</text>

  <line x1="1080" y1="514" x2="1080" y2="320" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="1092" y="416" font-size="12" font-weight="700" fill="#b91c1c">code = 2</text>

  <rect x="960" y="240" width="240" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1080" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">gateway 错误映射</text>
  <text x="1080" y="286" text-anchor="middle" font-size="11" fill="#b91c1c">gRPC → RESOURCE_EXHAUSTED</text>
  <text x="1080" y="304" text-anchor="middle" font-size="11" fill="#b91c1c">REST → Result.fail（code=2）</text>

  <polyline points="1080,240 1080,136 568,136" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="823" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">快速失败 · 客户端退避后重试</text>

  <!-- 处理与复制 -->
  <text x="180" y="930" font-size="13.5" font-weight="700" fill="#3730a3">处理与复制（不受闸门影响）</text>
  <rect x="180" y="936" width="720" height="140" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="330" y="984" width="160" height="68" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="410" y="1012" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e1b4b">raft 复制 / 提交</text>
  <text x="410" y="1034" text-anchor="middle" font-size="11" fill="#64748b">多节点强一致</text>
  <rect x="520" y="984" width="160" height="68" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="600" y="1012" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e1b4b">引擎处理命令</text>
  <text x="600" y="1034" text-anchor="middle" font-size="11" fill="#64748b">INTERNAL 写入不限流</text>
  <rect x="710" y="984" width="160" height="68" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="790" y="1012" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e1b4b">正常应答</text>
  <text x="790" y="1034" text-anchor="middle" font-size="11" fill="#64748b">含 processInstanceKey</text>
  <line x1="490" y1="1018" x2="514" y2="1018" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="680" y1="1018" x2="704" y2="1018" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <line x1="410" y1="804" x2="410" y2="978" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- 正常应答回路 -->
  <polyline points="330,1018 140,1018 140,120 256,120" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="124" y="570" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 124 570)">正常应答 · 含 processInstanceKey</text>

  <!-- 排空侧 -->
  <text x="180" y="1114" font-size="13.5" font-weight="700" fill="#14532d">排空侧（leader）· 消化积压</text>
  <rect x="180" y="1120" width="720" height="140" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="330" y="1168" width="160" height="68" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="410" y="1196" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">SinkService</text>
  <text x="410" y="1218" text-anchor="middle" font-size="11" fill="#166534">读 eventlog · 按序投递</text>
  <rect x="520" y="1168" width="160" height="68" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="1196" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">RecordSink</text>
  <text x="600" y="1218" text-anchor="middle" font-size="11" fill="#166534">写外部存储（慢源）</text>
  <rect x="710" y="1168" width="160" height="68" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="790" y="1196" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">位置确认</text>
  <text x="790" y="1218" text-anchor="middle" font-size="11" fill="#166534">updatePosition → 持久化</text>
  <line x1="490" y1="1202" x2="514" y2="1202" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="680" y1="1202" x2="704" y2="1202" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="410" y1="1052" x2="410" y2="1162" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- 重开反馈 -->
  <polyline points="870,1202 1230,1202 1230,616 505,616 505,602" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#aGreen)"/>
  <text x="1050" y="1188" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">sink 确认位置前移</text>
  <text x="1050" y="1224" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">lag ≤ resumeBacklog → 闸门重开</text>

  <!-- 图例 -->
  <rect x="60" y="1300" width="1160" height="218" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="84" y="1332" font-size="15" font-weight="700" fill="#0f172a">双阈值迟滞（防边界抖动）与关键语义</text>

  <rect x="84" y="1348" width="64" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="116" y="1366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">放行</text>
  <line x1="156" y1="1361" x2="186" y2="1361" stroke="#475569" stroke-width="1.6" marker-end="url(#aGray)"/>
  <text x="290" y="1366" text-anchor="middle" font-size="12" fill="#334155">lag ≥ rejectBacklog（50,000）</text>
  <line x1="388" y1="1361" x2="418" y2="1361" stroke="#475569" stroke-width="1.6" marker-end="url(#aGray)"/>
  <rect x="428" y="1348" width="64" height="26" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="460" y="1366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">拒绝</text>

  <rect x="84" y="1392" width="64" height="26" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="116" y="1410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">拒绝</text>
  <line x1="156" y1="1405" x2="186" y2="1405" stroke="#475569" stroke-width="1.6" marker-end="url(#aGray)"/>
  <text x="290" y="1410" text-anchor="middle" font-size="12" fill="#334155">lag ≤ resumeBacklog（40,000）</text>
  <line x1="388" y1="1405" x2="418" y2="1405" stroke="#475569" stroke-width="1.6" marker-end="url(#aGray)"/>
  <rect x="428" y="1392" width="104" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="1410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">放行（重开）</text>

  <text x="84" y="1452" font-size="12" fill="#475569">两阈值之间（40,000 ≤ lag &lt; 50,000）：维持当前状态，不在边界反复抖动</text>

  <line x1="616" y1="1348" x2="616" y2="1496" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="640" y="1362" font-size="12" fill="#334155">· 只拦 USER_COMMAND 入口：引擎 INTERNAL 写入、raft 复制、sink 排空照常推进</text>
  <text x="652" y="1380" font-size="12" fill="#334155">积压必然被消化、lag 单调下降，闭环收敛</text>
  <text x="640" y="1410" font-size="12" fill="#334155">· 无 sink 配置（lowest = −1）时闸门常开：与日志压缩门槛「−1 = 无约束」同语义</text>
  <text x="640" y="1438" font-size="12" fill="#334155">· 拒绝走 errorResponse 统一应答：调用方立即拿到可重试失败，</text>
  <text x="652" y="1456" font-size="12" fill="#334155">而非提交成功却长时间查不到</text>

  <line x1="84" y1="1492" x2="124" y2="1492" stroke="#dc2626" stroke-width="2.5"/>
  <text x="132" y="1496" font-size="11.5" fill="#475569">拒绝路径</text>
  <line x1="232" y1="1492" x2="272" y2="1492" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="280" y="1496" font-size="11.5" fill="#475569">滞后信号</text>
  <line x1="380" y1="1492" x2="420" y2="1492" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="428" y="1496" font-size="11.5" fill="#475569">重开反馈</text>
  <line x1="536" y1="1492" x2="576" y2="1492" stroke="#475569" stroke-width="2.5"/>
  <text x="584" y="1496" font-size="11.5" fill="#475569">正常链路</text>
</svg>
