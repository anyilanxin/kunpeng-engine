<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="aPurple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>

  <rect x="0" y="0" width="1440" height="860" fill="#ffffff"/>
  <text x="720" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">kunpeng 全系统背压控流总览（业务面写路径）</text>
  <text x="720" y="66" text-anchor="middle" font-size="13" fill="#64748b">三道准入闸门 · 排空闭环 · 阈值与启停全部经 kunpeng/configuration 配置注入</text>

  <!-- 配置面 -->
  <text x="641" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">kunpeng/configuration —— 阈值可配 · 每项可独立启用/禁用</text>
  <line x1="356" y1="92" x2="926" y2="92" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="356" y1="88" x2="356" y2="96" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="926" y1="88" x2="926" y2="96" stroke="#c4b5fd" stroke-width="1.5"/>

  <rect x="372" y="96" width="160" height="108" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="452" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">disk（DiskCfg）</text>
  <text x="452" y="144" text-anchor="middle" font-size="11" fill="#6b21a8">enableMonitoring: true</text>
  <text x="452" y="162" text-anchor="middle" font-size="11" fill="#6b21a8">freeSpace.processing: 2GB</text>
  <text x="452" y="180" text-anchor="middle" font-size="11" fill="#6b21a8">freeSpace.replication: 1GB</text>

  <rect x="546" y="96" width="190" height="108" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="641" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">flowControl.sink</text>
  <text x="641" y="144" text-anchor="middle" font-size="11" fill="#6b21a8">enabled: true（启停）</text>
  <text x="641" y="162" text-anchor="middle" font-size="11" fill="#6b21a8">rejectBacklog: 50000</text>
  <text x="641" y="180" text-anchor="middle" font-size="11" fill="#6b21a8">resumeBacklog: 40000</text>

  <rect x="750" y="96" width="160" height="108" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="830" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">flowControl.request</text>
  <text x="830" y="144" text-anchor="middle" font-size="11" fill="#6b21a8">enabled: true（启停）</text>
  <text x="830" y="162" text-anchor="middle" font-size="11" fill="#6b21a8">algorithm: AIMD / FIXED</text>
  <text x="830" y="180" text-anchor="middle" font-size="11" fill="#6b21a8">aimd 窗口: 100/10/1000</text>

  <line x1="452" y1="204" x2="452" y2="296" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>
  <line x1="641" y1="204" x2="641" y2="296" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>
  <line x1="830" y1="204" x2="830" y2="296" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>
  <text x="650" y="254" font-size="11" fill="#7c3aed">开关 + 阈值</text>

  <!-- 主链路 -->
  <rect x="48" y="300" width="130" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="113" y="332" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">调用方</text>
  <text x="113" y="354" text-anchor="middle" font-size="11" fill="#64748b">SDK · gRPC / REST</text>

  <rect x="202" y="300" width="130" height="80" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="267" y="332" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">gateway</text>
  <text x="267" y="354" text-anchor="middle" font-size="11" fill="#64748b">命令转发</text>

  <rect x="950" y="300" width="130" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1015" y="332" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">eventlog → raft</text>
  <text x="1015" y="354" text-anchor="middle" font-size="11" fill="#64748b">追加 · 复制提交</text>

  <rect x="1104" y="300" width="130" height="80" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1169" y="332" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e1b4b">引擎处理</text>
  <text x="1169" y="354" text-anchor="middle" font-size="11" fill="#64748b">INTERNAL 不限流</text>

  <rect x="1258" y="300" width="130" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1323" y="332" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">sink 排空</text>
  <text x="1323" y="354" text-anchor="middle" font-size="11" fill="#166534">RecordSink → 外部存储</text>

  <line x1="178" y1="340" x2="198" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="332" y1="340" x2="352" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="926" y1="340" x2="946" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="1080" y1="340" x2="1100" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="1234" y1="340" x2="1254" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- broker 准入面板 -->
  <rect x="356" y="260" width="570" height="160" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="368" y="284" font-size="12" font-style="italic" fill="#64748b">broker 命令准入（CommandApiHandleImpl · actor 线程 · 每分区）</text>

  <rect x="372" y="300" width="160" height="85" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="452" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#713f12">① 磁盘水位闸门</text>
  <text x="452" y="350" text-anchor="middle" font-size="11" fill="#854d0e">isDiskSpaceAvailable</text>
  <text x="452" y="370" text-anchor="middle" font-size="11" fill="#a16207">现有</text>

  <rect x="546" y="300" width="190" height="85" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="688" y="290" width="40" height="18" rx="5" fill="#ea580c"/>
  <text x="708" y="303" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">新增</text>
  <text x="566" y="328" font-size="13.5" font-weight="700" fill="#9a3412">② sink 滞后闸门</text>
  <text x="641" y="350" text-anchor="middle" font-size="11" fill="#9a3412">lag ≥ rejectBacklog</text>
  <text x="641" y="370" text-anchor="middle" font-size="11" fill="#c2410c">双阈值迟滞</text>

  <rect x="750" y="300" width="160" height="85" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="830" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#713f12">③ AIMD 在途窗口</text>
  <text x="830" y="350" text-anchor="middle" font-size="11" fill="#854d0e">USER_COMMAND 在途上限</text>
  <text x="830" y="370" text-anchor="middle" font-size="11" fill="#a16207">现有</text>

  <!-- 信号源 -->
  <rect x="372" y="470" width="160" height="60" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="452" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">磁盘使用监测</text>
  <text x="452" y="516" text-anchor="middle" font-size="11" fill="#0f766e">空闲 &lt; 阈值 → 拒绝</text>

  <rect x="546" y="470" width="190" height="178" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="641" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">滞后信号 lag</text>
  <text x="641" y="520" text-anchor="middle" font-size="11.5" fill="#0f766e">lastWrittenPosition</text>
  <text x="641" y="540" text-anchor="middle" font-size="11.5" fill="#0f766e">− lowestSinkPosition</text>
  <text x="641" y="560" text-anchor="middle" font-size="11" fill="#0f766e">volatile + TTL 缓存</text>
  <line x1="560" y1="576" x2="722" y2="576" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="641" y="602" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">无 sink 接入（lowest = −1）</text>
  <text x="641" y="624" text-anchor="middle" font-size="11.5" fill="#b91c1c">闸门常开 · 背压不存在</text>

  <rect x="750" y="470" width="160" height="60" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="830" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">处理进度 onProcessed</text>
  <text x="830" y="516" text-anchor="middle" font-size="11" fill="#0f766e">RTT 采样 · 窗口释放</text>

  <line x1="452" y1="470" x2="452" y2="389" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <line x1="641" y1="470" x2="641" y2="389" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <line x1="830" y1="470" x2="830" y2="389" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>

  <!-- 图例 -->
  <rect x="48" y="470" width="292" height="242" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="64" y="496" font-size="13" font-weight="700" fill="#0f172a">图例</text>
  <line x1="64" y1="520" x2="104" y2="520" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="112" y="524" font-size="11.5" fill="#475569">配置注入（启停 + 阈值）</text>
  <line x1="64" y1="548" x2="104" y2="548" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="112" y="552" font-size="11.5" fill="#475569">运行信号</text>
  <line x1="64" y1="576" x2="104" y2="576" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="112" y="580" font-size="11.5" fill="#475569">重开反馈（排空闭环）</text>
  <line x1="64" y1="604" x2="104" y2="604" stroke="#dc2626" stroke-width="2"/>
  <text x="112" y="608" font-size="11.5" fill="#475569">拒绝路径（快速失败）</text>
  <line x1="64" y1="632" x2="104" y2="632" stroke="#475569" stroke-width="2"/>
  <text x="112" y="636" font-size="11.5" fill="#475569">正常链路</text>
  <line x1="64" y1="652" x2="324" y2="652" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="64" y="676" font-size="11" font-style="italic" fill="#64748b">只拦业务面 USER_COMMAND 入口；</text>
  <text x="64" y="694" font-size="11" font-style="italic" fill="#64748b">管理面不设 sink 闸门。</text>

  <!-- 排空闭环反馈 -->
  <polyline points="1323,380 1323,700 641,700 641,652" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#aGreen)"/>
  <text x="982" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">sink 确认位置前移 · lag 下降 → 闸门重开（闭环收敛）</text>

  <!-- 拒绝错误链 -->
  <polyline points="925,420 925,736" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <rect x="356" y="740" width="734" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="723" y="768" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">任一闸门拒绝 → errorResponse（code） → gateway 错误映射</text>
  <text x="723" y="794" text-anchor="middle" font-size="12" fill="#b91c1c">gRPC → RESOURCE_EXHAUSTED · REST → Result.fail（code） · 客户端退避重试</text>
</svg>
