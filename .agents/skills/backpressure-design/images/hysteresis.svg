<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">双阈值迟滞状态机（防边界抖动）</text>
  <text x="500" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">两阈值之间维持原状态 —— 只有越过上界才拒绝、回落到下界才恢复</text>

  <!-- 分区底色 -->
  <rect x="120" y="110" width="820" height="70" fill="#fef2f2"/>
  <rect x="120" y="180" width="820" height="120" fill="#fffbeb"/>
  <rect x="120" y="300" width="820" height="120" fill="#f0fdf4"/>

  <text x="134" y="132" font-size="12" font-weight="700" fill="#b91c1c">拒绝区　lag &gt; 50,000</text>
  <text x="280" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">迟滞带 40,000 ≤ lag &lt; 50,000 · 维持原状态</text>
  <text x="134" y="410" font-size="12" font-weight="700" fill="#15803d">放行区　lag &lt; 40,000</text>

  <!-- 阈值线 -->
  <line x1="120" y1="180" x2="940" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="934" y="172" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">rejectBacklog = 50,000</text>
  <line x1="120" y1="300" x2="940" y2="300" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="934" y="292" text-anchor="end" font-size="12" font-weight="700" fill="#15803d">resumeBacklog = 40,000</text>

  <!-- 坐标轴 -->
  <line x1="120" y1="110" x2="120" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="120" y1="420" x2="940" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#aGray)"/>
  <line x1="114" y1="180" x2="120" y2="180" stroke="#475569" stroke-width="1.5"/>
  <line x1="114" y1="300" x2="120" y2="300" stroke="#475569" stroke-width="1.5"/>
  <text x="112" y="184" text-anchor="end" font-size="11" fill="#64748b">50,000</text>
  <text x="112" y="304" text-anchor="end" font-size="11" fill="#64748b">40,000</text>
  <text x="52" y="265" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 52 265)">lag（写入位 − sink 确认位）</text>
  <text x="930" y="438" text-anchor="end" font-size="11" fill="#64748b">时间 →</text>

  <!-- lag 曲线 -->
  <path d="M 140,402 Q 300,370 400,230 Q 436,176 500,158 Q 580,164 640,235 Q 700,290 745,302 Q 800,310 850,338 Q 900,368 930,392" fill="none" stroke="#475569" stroke-width="2.5"/>

  <circle cx="425" cy="180" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="738" cy="300" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>

  <text x="445" y="126" font-size="12" font-weight="700" fill="#b91c1c">lag ≥ rejectBacklog</text>
  <text x="445" y="144" font-size="12" fill="#b91c1c">→ 转拒绝</text>
  <text x="726" y="332" text-anchor="end" font-size="12" font-weight="700" fill="#15803d">lag ≤ resumeBacklog</text>
  <text x="726" y="350" text-anchor="end" font-size="12" fill="#15803d">→ 恢复放行（重开）</text>

  <!-- 状态条 -->
  <line x1="425" y1="186" x2="425" y2="452" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="738" y1="306" x2="738" y2="452" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>

  <rect x="120" y="452" width="305" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="272" y="471" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">闸门：放行</text>
  <rect x="425" y="452" width="313" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="581" y="471" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">闸门：拒绝</text>
  <rect x="738" y="452" width="202" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="839" y="471" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">放行（重开）</text>

  <text x="500" y="522" text-anchor="middle" font-size="12" fill="#64748b">默认值 rejectBacklog = 50,000 · resumeBacklog = 40,000（flowControl.sink 可配可启停）</text>
</svg>
