<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1060" height="500" fill="#ffffff"/>
  <text x="530" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">structpack 总体架构（五层）</text>
  <text x="530" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">模块 kunpeng/structpack · v1 key-id 自界定帧</text>

  <rect x="80" y="100" width="660" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="138" font-size="13.5" font-weight="700" fill="#1e3a8a">入口层</text>
  <text x="230" y="128" font-size="12.5" font-weight="700" fill="#0f172a">UnpackedObject (extends ObjectValue)</text>
  <text x="230" y="148" font-size="11" fill="#64748b">wrap(buffer)/write(buffer,off)/getLength/reset</text>
  <text x="780" y="138" font-size="11.5" fill="#64748b">Record/Entity 基类</text>

  <rect x="80" y="168" width="660" height="64" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="100" y="206" font-size="13.5" font-weight="700" fill="#6b21a8">槽位层</text>
  <text x="230" y="196" font-size="12.5" font-weight="700" fill="#0f172a">BaseProperty + 16 个子类</text>
  <text x="230" y="216" font-size="11" fill="#64748b">Long/String/Enum/Array/Document/Undeclared/...</text>
  <text x="780" y="206" font-size="11.5" fill="#64748b">id + key + 值载体 + 默认值 + isSet</text>

  <rect x="80" y="236" width="660" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="100" y="274" font-size="13.5" font-weight="700" fill="#134e4a">载体层</text>
  <text x="230" y="264" font-size="12.5" font-weight="700" fill="#0f172a">BaseValue + 15 个子类</text>
  <text x="230" y="284" font-size="11" fill="#64748b">LongValue/StringValue/.../MapValue</text>
  <text x="780" y="274" font-size="11.5" fill="#64748b">纯数据与编解码</text>

  <rect x="80" y="304" width="660" height="64" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="100" y="342" font-size="13.5" font-weight="700" fill="#1e1b4b">编解码层</text>
  <text x="230" y="332" font-size="12.5" font-weight="700" fill="#0f172a">PackerWriter / PackerReader</text>
  <text x="230" y="352" font-size="11" fill="#64748b">TAG_* 常量 + skipTyped() 通用跳过</text>
  <text x="780" y="342" font-size="11.5" fill="#64748b">varint/zigzag/裸原语</text>

  <rect x="80" y="372" width="660" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="100" y="410" font-size="13.5" font-weight="700" fill="#334155">工具层</text>
  <text x="230" y="410" font-size="12.5" font-weight="700" fill="#0f172a">DocumentUtil + DocumentCodec / BufferUtil</text>
  <text x="780" y="410" font-size="11.5" fill="#64748b">document 走标准 msgpack 字节</text>
</svg>
