<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 370" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1380" height="370" fill="#ffffff"/>
  <text x="690" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">wire 格式 v1：key-id 自界定帧</text>
  <text x="690" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">Record := 头部 + 已声明字段区 + 未声明逃逸区 · 值自界定，未知 id 按长度跳过</text>

  <!-- 分组括线 -->
  <line x1="268" y1="126" x2="922" y2="126" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="268" y1="120" x2="268" y2="132" stroke="#d97706" stroke-width="1.5"/>
  <line x1="922" y1="120" x2="922" y2="132" stroke="#d97706" stroke-width="1.5"/>
  <text x="595" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">已声明（declared）字段区</text>

  <line x1="938" y1="126" x2="1322" y2="126" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="938" y1="120" x2="938" y2="132" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="1322" y1="120" x2="1322" y2="132" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1130" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">未声明（undeclared）逃逸区</text>

  <text x="60" y="144" font-size="12" font-weight="700" fill="#475569">Record :=</text>

  <!-- 帧分段 -->
  <rect x="60" y="152" width="110" height="78" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">MAGIC</text>
  <text x="115" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">0x4B 0x50 · 2B</text>

  <rect x="170" y="152" width="90" height="78" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="215" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">VER</text>
  <text x="215" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">0x01 · 1B</text>

  <rect x="260" y="152" width="150" height="78" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="335" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">FIELD_COUNT</text>
  <text x="335" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">varint</text>

  <rect x="410" y="152" width="220" height="78" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">FIELD_ID ×N</text>
  <text x="520" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">varint · 严格升序</text>

  <rect x="630" y="152" width="300" height="78" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="780" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">[ VALUE_LEN + VALUE ]*</text>
  <text x="780" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">值长度前缀 varint · × N</text>

  <rect x="930" y="152" width="190" height="78" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1025" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">UNDECLARED_COUNT</text>
  <text x="1025" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">varint</text>

  <rect x="1120" y="152" width="210" height="78" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1225" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">{ KEY_LEN KEY VALUE }*</text>
  <text x="1225" y="212" text-anchor="middle" font-size="10.5" fill="#6b21a8">KEY bytes 带 tag · × N</text>

  <!-- 注释引线 -->
  <line x1="520" y1="230" x2="520" y2="264" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="520" y="282" text-anchor="middle" font-size="11.5" fill="#475569">id 定义于 Property 构造首参，~1B/字段</text>

  <line x1="780" y1="230" x2="780" y2="302" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="780" y="320" text-anchor="middle" font-size="11.5" fill="#475569">值自界定：已知按类型解析，未知按长度跳过</text>
</svg>
