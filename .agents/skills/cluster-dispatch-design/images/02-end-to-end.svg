<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1720" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1520" height="1720" fill="#ffffff"/>
  <text x="760" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">集群调度端到端流程（admin 分区日志驱动）</text>
  <text x="760" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">COMMAND / COMMAND_API 记录驱动 · EVENT 经 applier 落 RocksDB · 明细按 executionOrder 串行</text>

  <!-- 分组框（先画，生命线覆盖其上） -->
  <rect x="330" y="336" width="450" height="422" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="336" width="100" height="22" rx="4" fill="#e2e8f0"/>
  <text x="342" y="352" font-size="11.5" font-weight="700" fill="#475569">alt 成员不足</text>
  <line x1="330" y1="506" x2="780" y2="506" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="342" y="526" font-size="11.5" font-weight="700" fill="#64748b">else 满足条件</text>

  <rect x="330" y="660" width="240" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="660" width="100" height="22" rx="4" fill="#e2e8f0"/>
  <text x="342" y="676" font-size="11.5" font-weight="700" fill="#475569">opt applyPlan</text>

  <rect x="330" y="816" width="240" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="816" width="88" height="22" rx="4" fill="#e2e8f0"/>
  <text x="342" y="832" font-size="11.5" font-weight="700" fill="#475569">alt 明细为空</text>
  <line x1="330" y1="898" x2="570" y2="898" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="342" y="918" font-size="11.5" font-weight="700" fill="#64748b">else</text>

  <rect x="330" y="998" width="1040" height="570" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="998" width="250" height="22" rx="4" fill="#e2e8f0"/>
  <text x="342" y="1014" font-size="11.5" font-weight="700" fill="#475569">loop 每条明细（executionOrder 串行）</text>

  <rect x="330" y="1370" width="640" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="1370" width="70" height="22" rx="4" fill="#e2e8f0"/>
  <text x="342" y="1386" font-size="11.5" font-weight="700" fill="#475569">alt 成功</text>
  <line x1="330" y1="1466" x2="970" y2="1466" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="342" y="1486" font-size="11.5" font-weight="700" fill="#64748b">else 失败</text>

  <!-- 生命线 -->
  <line x1="160" y1="156" x2="160" y2="1680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="360" y1="156" x2="360" y2="1680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="560" y1="156" x2="560" y2="1680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="760" y1="156" x2="760" y2="1680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="960" y1="156" x2="960" y2="1680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="1160" y1="156" x2="1160" y2="1680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="1360" y1="156" x2="1360" y2="1680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- 消息 -->
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">类型入口命令（CHANGE_*）</text>
  <line x1="164" y1="192" x2="356" y2="192" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="216" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">Change{Replication,Partition}/</text>
  <text x="460" y="232" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">ClusterBalance 处理器</text>
  <line x1="364" y1="244" x2="556" y2="244" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="268" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">PLAN_CREATING</text>
  <line x1="556" y1="280" x2="364" y2="280" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="304" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">ClusterCreatingProcessor</text>
  <line x1="364" y1="316" x2="556" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="384" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">延迟任务 CREATED + PLAN_DELAYED</text>
  <line x1="556" y1="396" x2="364" y2="396" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <rect x="395" y="416" width="330" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="440" text-anchor="middle" font-size="11.5" fill="#92400e">DelayedDelayChecker 到期</text>
  <text x="560" y="462" text-anchor="middle" font-size="11.5" fill="#92400e">DelayedTriggerProcessor 重发 PLAN_CREATING</text>

  <text x="660" y="556" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">createPlan（拓扑 diff 推导明细）</text>
  <line x1="564" y1="568" x2="756" y2="568" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="660" y="592" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">计划 + executionPlan</text>
  <line x1="756" y1="604" x2="564" y2="604" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>

  <text x="460" y="628" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">PLAN_CREATED（事件，落库）</text>
  <line x1="556" y1="640" x2="364" y2="640" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="700" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">EXECUTING（计划级命令）</text>
  <line x1="556" y1="712" x2="364" y2="712" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="782" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">ClusterExecutingProcessor</text>
  <line x1="364" y1="794" x2="556" y2="794" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="864" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">COMPLETED</text>
  <line x1="556" y1="876" x2="364" y2="876" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="940" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">EXECUTED（事件）+ 首条明细 EXECUTING</text>
  <line x1="556" y1="952" x2="364" y2="952" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="660" y="1046" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">ExecutionExecutingProcessor</text>
  <line x1="364" y1="1058" x2="956" y2="1058" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="660" y="1082" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">EXECUTED（事件）+ 延迟看门狗注册</text>
  <line x1="956" y1="1094" x2="364" y2="1094" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="1060" y="1118" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">dispatchClient.send</text>
  <text x="1060" y="1134" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">（topic=面-执行类型）</text>
  <line x1="964" y1="1146" x2="1156" y2="1146" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <polyline points="1160,1170 1214,1170 1214,1194 1168,1194" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1224" y="1188" font-size="11.5" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">执行 + executionAck()</text>

  <text x="1260" y="1236" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">ack 消息</text>
  <text x="1260" y="1252" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">（topic CLUSTER_DISPATCH_ACK）</text>
  <line x1="1164" y1="1264" x2="1356" y2="1264" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="860" y="1288" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">写明细 ACKNOWLEDGE 命令</text>
  <text x="860" y="1304" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">（附成败/errorMessage）</text>
  <line x1="1356" y1="1316" x2="364" y2="1316" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="660" y="1340" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">ExecutionAcknowledgeProcessor</text>
  <line x1="364" y1="1352" x2="956" y2="1352" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="660" y="1418" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">SUCCEED + 下一条 EXECUTING</text>
  <text x="660" y="1434" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">或计划 COMPLETING</text>
  <line x1="956" y1="1446" x2="364" y2="1446" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="660" y="1508" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">FAILED + 注册延迟重试（不终止计划）</text>
  <line x1="956" y1="1520" x2="364" y2="1520" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="1592" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">CompleteProcessor（COMPLETING）</text>
  <line x1="364" y1="1604" x2="556" y2="1604" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <text x="460" y="1628" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">COMPLETED + ClusterMeta</text>
  <text x="460" y="1644" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">CREATING/UPDATING（落库）</text>
  <line x1="556" y1="1656" x2="364" y2="1656" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- 参与者 -->
  <rect x="85" y="100" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">客户端/adminInit</text>

  <rect x="285" y="100" width="150" height="56" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="360" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">admin 分区日志</text>

  <rect x="490" y="100" width="140" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">计划层处理器</text>

  <rect x="660" y="100" width="200" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="760" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">PlanMaker/Generator</text>

  <rect x="890" y="100" width="140" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">明细层处理器</text>

  <rect x="1080" y="100" width="160" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1160" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">业务节点执行服务</text>

  <rect x="1255" y="100" width="210" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1360" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ClusterDispatchService</text>
</svg>
