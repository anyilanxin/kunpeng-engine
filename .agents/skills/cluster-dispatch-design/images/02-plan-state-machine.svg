  <rect x="770" y="300" width="150" height="56" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="845" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">EXECUTING</text>

  <rect x="980" y="300" width="150" height="56" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
