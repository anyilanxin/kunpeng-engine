  <line x1="370" y1="196" x2="370" y2="311" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="356" y="256" text-anchor="end" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">延迟到期重入</text>

  <line x1="490" y1="328" x2="546" y2="328" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="518" y="292" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">createPlan 落库</text>

  <line x1="710" y1="328" x2="766" y2="328" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="738" y="292" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">applyPlan</text>

  <line x1="920" y1="328" x2="976" y2="328" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="948" y="292" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">启动首条明细</text>

  <line x1="1130" y1="328" x2="1186" y2="328" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1158" y="292" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">全部明细 SUCCEED</text>

  <line x1="1350" y1="328" x2="1406" y2="328" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1378" y="292" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">+ 集群元数据</text>

  <line x1="1570" y1="328" x2="1632" y2="328" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <line x1="1270" y1="356" x2="1270" y2="476" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="1340" y1="508" x2="1416" y2="508" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="1495" y1="536" x2="1495" y2="600" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <line x1="195" y1="356" x2="195" y2="476" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="207" y="422" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">取消</text>
  <line x1="280" y1="508" x2="346" y2="508" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="430" y1="536" x2="430" y2="600" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
</svg>
