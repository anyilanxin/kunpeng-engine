  <circle cx="1650" cy="328" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="1650" cy="328" r="9" fill="#0f172a"/>
  <circle cx="430" cy="620" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="430" cy="620" r="9" fill="#0f172a"/>
  <circle cx="1495" cy="620" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="1495" cy="620" r="9" fill="#0f172a"/>

