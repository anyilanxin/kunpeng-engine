<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 690" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1720" height="690" fill="#ffffff"/>
  <text x="860" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">调度计划生命周期状态机</text>
  <text x="860" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">AdminDispatchPlanLifeCycle 与 BusinessDispatchPlanLifeCycle 同构 · business 侧多两个类型入口</text>

  <!-- 初始态 -->
  <circle cx="80" cy="328" r="7" fill="#0f172a"/>

  <!-- 延迟态 -->
  <rect x="330" y="140" width="160" height="56" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="410" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">PLAN_DELAYED</text>

  <!-- 主链状态 -->
  <rect x="120" y="300" width="150" height="56" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">CHANGE_x</text>

  <rect x="330" y="300" width="160" height="56" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
