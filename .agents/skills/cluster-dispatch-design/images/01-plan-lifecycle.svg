<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 660" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1680" height="660" fill="#ffffff"/>
  <text x="840" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">统一计划生命周期链路</text>
  <text x="840" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">类型化生命周期直驱 · 管理与业务两套同构 · 执行明细串行推进 · 失败重试不终止计划</text>

  <!-- 类型入口 -->
  <rect x="60" y="290" width="180" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">类型入口命令</text>
  <text x="150" y="348" text-anchor="middle" font-size="11" fill="#64748b">CHANGE_REPLICATION /</text>
  <text x="150" y="368" text-anchor="middle" font-size="11" fill="#64748b">CHANGE_PARTITION /</text>
  <text x="150" y="388" text-anchor="middle" font-size="11" fill="#64748b">CLUSTER_BALANCE</text>

  <!-- 延迟等待 -->
  <rect x="286" y="120" width="130" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="351" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">PLAN_DELAYED</text>
  <text x="351" y="176" text-anchor="middle" font-size="11" fill="#b45309">（延迟等待）</text>

  <!-- 主链 -->
  <rect x="286" y="315" width="130" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="351" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">PLAN_CREATING</text>

  <rect x="462" y="315" width="130" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="527" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">PLAN_CREATED</text>

  <rect x="638" y="300" width="170" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="723" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">EXECUTING</text>
  <text x="723" y="356" text-anchor="middle" font-size="11" fill="#64748b">（计划级，启动首条明细）</text>

  <rect x="854" y="315" width="120" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="914" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">EXECUTED</text>

  <rect x="1020" y="290" width="230" height="100" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1135" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">明细串行：</text>
  <text x="1135" y="346" text-anchor="middle" font-size="11" fill="#475569">EXECUTING→EXECUTED→ACKNOWLEDGE</text>
  <text x="1135" y="366" text-anchor="middle" font-size="11" fill="#475569">→SUCCEED/FAILED</text>

  <rect x="1306" y="315" width="130" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1371" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">COMPLETING</text>

  <rect x="1482" y="300" width="160" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1562" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">COMPLETED</text>
  <text x="1562" y="356" text-anchor="middle" font-size="11" fill="#166534">+ 集群元数据落库</text>

  <!-- 取消 / 失败（源图中即无入边） -->
  <rect x="462" y="520" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="527" y="556" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">CANCELING</text>

  <rect x="638" y="520" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="703" y="556" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">CANCELED</text>

  <rect x="1306" y="520" width="120" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1366" y="556" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">FAILING</text>

  <rect x="1482" y="520" width="120" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1542" y="556" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">FAILED</text>

  <!-- 主链箭头 -->
  <line x1="240" y1="345" x2="282" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="416" y1="345" x2="458" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="437" y="304" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">计划制定完成</text>
  <line x1="592" y1="345" x2="634" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="808" y1="345" x2="850" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="974" y1="345" x2="1016" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="1250" y1="345" x2="1302" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="1276" y="304" text-anchor="middle" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">全部完成</text>
  <line x1="1436" y1="345" x2="1478" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>

  <!-- 延迟环 -->
  <line x1="410" y1="300" x2="410" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="424" y="256" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">成员不足</text>
  <line x1="370" y1="196" x2="370" y2="311" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="356" y="256" text-anchor="end" font-size="12" fill="#475569" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">到期重入</text>

  <!-- 明细失败重试自环 -->
  <polyline points="1100,390 1100,448 1190,448 1190,394" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aRed)"/>
  <text x="1145" y="470" text-anchor="middle" font-size="12" fill="#b91c1c">失败重试（不终止）</text>

  <!-- 取消 / 失败箭头 -->
  <line x1="592" y1="550" x2="634" y2="550" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
  <line x1="1426" y1="550" x2="1478" y2="550" stroke="#475569" stroke-width="1.8" marker-end="url(#aGray)"/>
</svg>
