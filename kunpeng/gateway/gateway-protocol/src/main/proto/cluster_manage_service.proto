syntax = 'proto3';
package gateway_protocol;

option java_multiple_files = false;
option java_package = "com.anyilanxin.kunpeng.gateway.grpc.service";
option go_package = "./;pb";



message ClusterTopologyRequest {
}

message ClusterTopologyResponse {
  // list of brokers part of this cluster
  repeated BrokerInfo brokers = 1;
  // how many nodes are in the cluster
  int32 clusterSize = 2;
  // how many partitions are spread across the cluster
  int32 partitionsCount = 3;
  // configured replication factor for this cluster
  int32 replicationFactor = 4;
  // gateway version
  string gatewayVersion = 5;
}

message BrokerInfo {
  // unique (within a cluster) node ID for the broker
  int32 nodeId = 1;
  // hostname of the broker
  string host = 2;
  // port for the broker
  int32 port = 3;
  // list of partitions managed or replicated on this broker
  repeated Partition partitions = 4;
  // broker version
  string version = 5;
}

message Partition {
  // Describes the Raft role of the broker for a given partition
  enum PartitionBrokerRole {
    LEADER = 0;
    FOLLOWER = 1;
    INACTIVE = 2;
  }

  // Describes the current health of the partition
  enum PartitionBrokerHealth {
    HEALTHY = 0;
    UNHEALTHY = 1;
    DEAD = 2;
  }

  // the unique ID of this partition
  int32 partitionId = 1;
  // the role of the broker for this partition
  PartitionBrokerRole role = 2;
  // the health of this partition
  PartitionBrokerHealth health = 3;
}


message GatewayInfo {
  string nodeId = 1;
  string grpcAddress = 2;
  string gatewayAddress = 3;
  bool allowClientDiscovery = 4;
  // broker version
  string version = 6;
}

message QueryGatewayRequest {
}

message QueryGatewayResponse {
  repeated GatewayInfo gateways = 5;
}

message QueryGatewayLoadRequest {
  // 目标网关的 grpcAddress。为空或等于本机 grpcAddress 时直接返回本机负载；
  // 否则由收到请求的网关通过 ClusterCommunicationService 转发到目标网关。
  string targetGrpcAddress = 1;
}

message QueryGatewayLoadResponse {
  // node id of the gateway handling this request
  string nodeId = 1;
  // current number of active client connections to this gateway
  int32 activeConnections = 2;
}


service ClusterManageService {
  /*
    Deploys one or more resources (e.g. processes or decision models) to Zeebe.
    Note that this is an atomic call, i.e. either all resources are deployed, or none of them are.

    Errors:
      PERMISSION_DENIED:
        - if a deployment to an unauthorized tenant is performed
      INVALID_ARGUMENT:
        - no resources given.
        - if at least one resource is invalid. A resource is considered invalid if:
          - the content is not deserializable (e.g. detected as BPMN, but it's broken XML)
          - the content is invalid (e.g. an event-based gateway has an outgoing sequence flow to a task)
        - if multi-tenancy is enabled, and:
          - a tenant id is not provided
          - a tenant id with an invalid format is provided
        - if multi-tenancy is disabled and a tenant id is provided
  */
  rpc ClusterTopology (ClusterTopologyRequest) returns (ClusterTopologyResponse) {
  }


  rpc QueryGateway (QueryGatewayRequest) returns (QueryGatewayResponse) {

  }

  // Returns the load metrics of the gateway that handles this request. Used by
  // clients as both a load signal and a liveness probe — failure to receive a
  // response indicates the gateway is unreachable.
  rpc QueryGatewayLoad (QueryGatewayLoadRequest) returns (QueryGatewayLoadResponse) {

  }
}
