plugins {
    id 'kunpeng.build-publish'
}

description = "Kunpeng Restore"

configure(jarInfo) {
    archiveName = "kunpeng-restore"
}

dependencies {
    implementation project(':kunpeng:utils')
    implementation project(':kunpeng:cluster:cluster')
    implementation 'io.netty:netty-common'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'tools.jackson.core:jackson-core'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.google.guava:guava'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'com.netflix.concurrency-limits:concurrency-limits-core'
}
