import org.apache.tools.ant.filters.ReplaceTokens
plugins {
    id 'kunpeng.build-publish'
}

description = "Kunpeng Bpmn Model"

configure(jarInfo) {
    archiveName = "kunpeng-bpmn-model"
    licenseType = "apache,mpl"
}


dependencies {
    api project(':kunpeng:bpm-model:xml-model')

    implementation "com.cronutils:cron-utils"
    testCompileOnly 'org.hamcrest:hamcrest'
}


processResources {
    filteringCharset = 'UTF-8'
    include('*.properties', "*.xsd")
    filesMatching('*.properties') {
        filter(ReplaceTokens, tokens: ['project.version': version])
    }
}
