import org.apache.tools.ant.filters.ReplaceTokens
plugins {
    id 'kunpeng.build-publish'
}

description = "Kunpeng Bpm Model Parse"

configure(jarInfo) {
    archiveName = "kunpeng-bpm-model-parse"
}


dependencies {
    api project(':kunpeng:bpm-model:dmn-model')
    api project(':kunpeng:bpm-model:bpmn-model')

    implementation project(':kunpeng:structpack')
    implementation project(':kunpeng:utils')
    implementation project(':kunpeng:engine:script-engine')
    implementation 'org.springframework:spring-beans'
}

