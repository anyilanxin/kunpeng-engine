plugins {
    id 'kunpeng.sbe-java'
    id 'kunpeng.build-publish'
}

description = "Cluster"

configure(jarInfo) {
    archiveName = "kunpeng-cluster"
}

tasks.withType(Test).configureEach {
    // 悬挂防护: 与原 cluster 模块保持一致
    systemProperty 'junit.jupiter.execution.timeout.default', '3m'
    systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'separate_thread'
    // 10 节点基准探针参数透传(-D 传给 Gradle JVM, 需显式转交给测试 JVM): 线程模式/socket 缓冲/大报文尺寸
    systemProperty 'bench.aeron.threading', System.getProperty('bench.aeron.threading', 'SHARED')
    systemProperty 'bench.aeron.socketbuf', System.getProperty('bench.aeron.socketbuf', '-1')
    systemProperty 'bench.large.payload.bytes', System.getProperty('bench.large.payload.bytes', "${1024 * 1024}")
    systemProperty 'bench.file.chunks', System.getProperty('bench.file.chunks', '4096,1024,256')
    systemProperty 'bench.file.total.mib', System.getProperty('bench.file.total.mib', '128')
    systemProperty 'bench.nodes', System.getProperty('bench.nodes', '10')
    useJUnitPlatform {
        if (!project.hasProperty('randomized')) {
            excludeTags 'randomized'
        }
    }
}
dependencies {
    implementation project(':kunpeng:protocol:protocol-common')
    implementation project(':kunpeng:utils')
    implementation project(':kunpeng:scheduler')
    implementation project(':kunpeng:structpack')
    // Aeron 通信底座: 仅需 client + 内嵌 driver(传递携带 aeron-client/agrona), 无需 archive/cluster 的全量聚合包 aeron-all
    implementation 'io.aeron:aeron-driver'
    implementation 'org.agrona:agrona'
    // Address 等移植类型仍使用 netty-common 的 NetUtil 与 guava 的 HostAndPort
    implementation 'io.netty:netty-common'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.fory:fory-core'
    implementation 'com.google.guava:guava'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-commons'
    implementation 'com.github.jnr:jnr-posix'
    implementation 'org.apache.commons:commons-math3'
    implementation 'tools.jackson.core:jackson-databind'
    compileOnly 'net.jcip:jcip-annotations'

    testImplementation 'net.jodah:concurrentunit'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation('org.jmock:jmock') {
        exclude group: 'net.bytebuddy', module: 'byte-buddy'
    }
    testImplementation 'net.jqwik:jqwik'
    testImplementation 'net.jqwik:jqwik-api'
    testImplementation 'org.junit.vintage:junit-vintage-engine'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on'
    testImplementation 'org.bouncycastle:bcprov-jdk18on'
    testImplementation 'org.apache.logging.log4j:log4j-core'
    testImplementation 'org.apache.logging.log4j:log4j-api'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl'
}
