plugins {
    id 'kunpeng.build-publish'
}

description = "Kunpeng EventLog"

configure(jarInfo) {
    archiveName = "kunpeng-eventlog"
}

dependencies {
    implementation project(':kunpeng:structpack')
    implementation 'org.agrona:agrona'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-commons'
    implementation 'org.slf4j:slf4j-api'

    testImplementation 'org.awaitility:awaitility'
    testImplementation project(':kunpeng:utils')
}
