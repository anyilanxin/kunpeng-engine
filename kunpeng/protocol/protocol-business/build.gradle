plugins {
    id 'kunpeng.build-publish'
    id 'kunpeng.sbe-java'
}

description = "Kunpeng Protocol"

configure(jarInfo) {
    archiveName = "kunpeng-protocol-business"
    licenseType = "mpl"
}


dependencies {
    api project(':kunpeng:structpack')
    api project(':kunpeng:protocol:protocol-common')

    // ActivityInstanceRecordValue 签名引用 BpmnElementType，公共枚举下沉在 bpm-common
    implementation project(':kunpeng:bpm-model:bpm-common')
    implementation project(':kunpeng:utils')
    implementation 'org.agrona:agrona'
    implementation 'com.github.spotbugs:spotbugs-annotations'
    implementation 'net.jcip:jcip-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
}
