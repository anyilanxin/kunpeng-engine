plugins {
    id 'kunpeng.build-publish'
}

description = "element-template-generator-http"

configure(jarInfo) {
    archiveName = "kunpeng-connector-element-template-http-dsl"
}


dependencies {
    implementation project(':connector:element-template-generator:annotations')
    implementation project(':connector:element-template-generator:generator-core')
    implementation project(':connector:connector-runtime:connector-feel')
    implementation project(':connector:connector-commons:http-base')
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'tools.jackson.core:jackson-databind'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
}
