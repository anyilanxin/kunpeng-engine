plugins {
    id 'kunpeng.build-publish'
}

description = "Connector SDK Test"

configure(jarInfo) {
    archiveName = "kunpeng-connector-sdk-test"
}


dependencies {
    implementation project(':connector:connector-sdk:core')
    implementation 'org.junit.jupiter:junit-jupiter-api'
    implementation 'org.mockito:mockito-core'
    implementation 'org.assertj:assertj-core'
}
