plugins {
    id "com.diffplug.spotless"
}


spotless {
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'
        trimTrailingWhitespace()
        indentWithTabs()
        endWithNewline()
    }
    json {
        target '**/*.json'
        // .mimosa/hook-state 是安全扫描 hook 自己的运行时状态(每次执行都会重写为单行 json), 已被 gitignore, 不参与格式化门禁
        // .gradle/nodejs 是 node 插件下载的 Node 发行包(跑过前端构建后才有), node_modules 里是包管理器自己的状态文件; 都已被 gitignore, 不是本仓的源文件
        // targetExclude 每次调用是整体替换而不是追加, 要排除的目录必须写在同一次调用里
        targetExclude '**/.mimosa/**', '**/.gradle/**', '**/node_modules/**'
        simple()
    }
    yaml {
        target '**/src/**/*.yaml', '**/src/**/*.yml'
        prettier()
    }
    java {
        target("**/src/main/java/**/*.java")
        googleJavaFormat()
        formatAnnotations()
        indentWithSpaces()
        importOrder()
        trimTrailingWhitespace()
        endWithNewline()
        toggleOffOn("formatting:off", "formatting:on")
        targetExclude("**/build/generated/source*/**/*.*")
    }
}

compileJava.dependsOn("spotlessApply")
