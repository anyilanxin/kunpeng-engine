plugins {
    id 'kunpeng.build-publish'
}

description = "Spring Boot Starter Kunpeng Client"

configure(jarInfo) {
    archiveName = "spring-boot-starter-kunpeng-client"
    licenseType = "mpl"
}


dependencies{
    api project(':clients:client-java')
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework.boot:spring-boot-health'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-micrometer-metrics'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-beans'
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'tools.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-actuator'
    implementation 'io.grpc:grpc-api'
    implementation 'org.springframework:spring-aop'
    implementation ('commons-beanutils:commons-beanutils'){
        exclude group: 'commons-collections', module: 'commons-collections'
    }
    implementation 'io.grpc:grpc-stub'
    implementation 'io.grpc:grpc-core'
    implementation 'io.grpc:grpc-api'
    implementation 'io.grpc:grpc-netty'
    implementation 'org.assertj:assertj-core'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}
