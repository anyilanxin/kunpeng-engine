plugins {
    id 'kunpeng.build-publish'
}

description = "Kunpeng Client"

configure(jarInfo) {
    archiveName = "kunpeng-client"
    licenseType = "mpl"
}


dependencies {
    implementation project(':kunpeng:utils')
    implementation project(':kunpeng:cluster:cluster')
    implementation 'org.apache.fory:fory-core'
    implementation project(':kunpeng:bpm-model:bpmn-model')
    implementation project(':kunpeng:gateway:gateway-protocol')
    implementation 'org.apache.commons:commons-lang3'
    implementation 'commons-io:commons-io'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'tools.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.google.code.findbugs:jsr305'
    implementation 'io.grpc:grpc-stub'
    implementation 'io.grpc:grpc-core'
    implementation 'com.yomahub:roguemap-core'
    implementation 'io.grpc:grpc-api'
    implementation 'io.grpc:grpc-netty'
    implementation 'com.google.protobuf:protobuf-java'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-commons'
    implementation 'io.netty:netty-handler'
    implementation 'io.netty:netty-common'
    implementation 'net.jcip:jcip-annotations'
    implementation 'com.auth0:java-jwt'
    implementation 'org.apache.httpcomponents.core5:httpcore5'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
    compileOnly 'javax.annotation:javax.annotation-api'

    runtimeOnly ('io.netty:netty-tcnative-boringssl-static') {
        artifact {}
        artifact { classifier = "linux-x86_64" }
        artifact { classifier = "linux-aarch_64" }
        artifact { classifier = "osx-x86_64" }
        artifact { classifier = "osx-aarch_64" }
        artifact { classifier = "windows-x86_64" }
    }
    runtimeOnly 'io.grpc:grpc-util'
}


